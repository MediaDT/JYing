  let lang = localStorage.getItem(LANG_KEY) === "en" ? "en" : "zh";
  const t = () => I18N[lang];

  function currentMode() {
    const c = (typeof conversations !== "undefined") && conversations.find((x) => x.id === currentId);
    return c && ["creative", "landing"].includes(c.mode) ? c.mode : "campaign";
  }

  /** 把界面上所有静态文案刷成当前语言 */
  /** 只改按钮里的文字标签，别碰它前面的图标。
   *  原来是 `btn.textContent = 文案`，那会把 <svg> 一起冲掉 —— 图标当场消失，
   *  而且**只在切语言之后才消失**，一眼看不出是哪一步弄的。 */
  function setBtnLabel(id, text) {
    const el = document.getElementById(id);
    if (!el) return;
    const lbl = el.querySelector(".lbl");
    if (lbl) lbl.textContent = text; else el.textContent = text;
  }

  const LOGO_BOT = '<svg class="ico logo-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></svg>';
  const LOGO_CREATIVE = '<svg class="ico logo-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/></svg>';
  const LOGO_LANDING = '<svg class="ico logo-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="7" x="3" y="3" rx="1"/><rect width="9" height="7" x="3" y="14" rx="1"/><rect width="5" height="7" x="16" y="14" rx="1"/></svg>';

  function applyLang() {
    const d = t();
    document.documentElement.lang = lang === "en" ? "en" : "zh-CN";
    const mode = currentMode();
    const creative = mode === "creative", landing = mode === "landing";
    document.title = landing ? d.landingTitle : creative ? d.creativeTitle : d.title;
    document.getElementById("app-title").textContent = landing ? d.landingTitle : creative ? d.creativeTitle : d.title;
    document.getElementById("app-sub").textContent = landing ? d.landingSub : creative ? d.creativeSub : d.sub.replace("{p}", PLATFORM_NAME);
    document.getElementById("app-hint").textContent = landing ? d.landingHint : creative ? d.creativeHint : d.hint;
    document.getElementById("app-logo").innerHTML =
      landing ? LOGO_LANDING : creative ? LOGO_CREATIVE : LOGO_BOT;
    setBtnLabel("campaign-mode", d.campaignMode);
    setBtnLabel("creative-mode", d.creativeMode);
    setBtnLabel("landing-mode", d.landingMode);
    setBtnLabel("platform-btn", lang === "en" ? "Platforms" : "切换平台");
    document.getElementById("campaign-mode").classList.toggle("active", mode === "campaign");
    document.getElementById("creative-mode").classList.toggle("active", creative);
    document.getElementById("landing-mode").classList.toggle("active", landing);

    const langBtn = document.getElementById("lang-toggle");
    setBtnLabel("lang-toggle", d.langBtn);
    langBtn.title = d.langBtnTitle;

    const newChatBtn = document.getElementById("new-chat");
    setBtnLabel("new-chat", d.newChat);
    newChatBtn.title = d.newChatTitle;

    var dashBtn = document.getElementById("dash-btn");
    if (dashBtn) { setBtnLabel("dash-btn", d.dashBtn); dashBtn.title = d.dashBtnTitle; }

    // 账户按钮和弹窗也跟着换语言。
    // 必须用 acctReady 判断:账户模块在本文件末尾才初始化,而 applyLang 在那之前就会被调用一次;
    // 那时 renderAcctBtn 虽已"提升"可调用,但它依赖的 const 变量还没初始化,直接调会抛错、中断整个初始化。
    if (acctReady) {
      renderAcctBtn();
      if (document.getElementById("acct-overlay").classList.contains("show")) renderAcctModal();
    }
    document.getElementById("sidebar-head").textContent = d.sidebarHead;
    document.getElementById("sidebar-toggle").title = d.sidebarToggleTitle;
    if (typeof renderConvList === "function") renderConvList();
    document.getElementById("attach").title = d.attachTitle;
    document.getElementById("send").title = d.sendTitle;
    inputEl.placeholder = landing
      ? (lang === "en" ? "Describe the landing page you want to research or build…" : "说说要研究或制作什么落地页…")
      : creative ? (lang === "en" ? "Describe the creative you want to make…" : "说说你想做什么素材…") : d.placeholder;
  }

  // ===== 页面的"记忆":完整聊天记录。API 不记事,每次都把它全量发给后端 =====
  // 存在浏览器的 localStorage 里,刷新/关标签页都不会丢(换浏览器或清缓存才会没)
  var acctReady;   // 账户模块是否已初始化(见文件末尾「广告账户接入」)

  const STORE_KEY = "adbot-chat-history";        // 老版本的单条历史(用于一次性迁移)
  const CONVS_KEY = "adbot-conversations";       // 新版:所有会话
  const CUR_KEY = "adbot-current-conv";          // 当前打开的是哪个会话
  // 这份本地缓存属于哪个账号。同一台电脑换人登录时靠它认出"缓存不是我的"。
  const UID_KEY = "adbot-cache-uid";
  const MAX_KEEP = 200;    // 单个会话最多留 200 条
  // **必须和服务端 accounts.py 的 MAX_CONVS 一致**:前端是按这个数裁完之后
  // 把**整份**列表 PUT 上去的,这边小一截 = 每次打开页面都在悄悄删服务器上的旧对话。
  const MAX_CONVS = 50;    // 左栏最多留 50 个会话,超了丢最旧的

  /** 读出所有会话。顺手把老版本的单条历史迁移成第一个会话,不丢用户数据。 */
  function loadConversations() {
    let convs = [];
    try {
      const raw = localStorage.getItem(CONVS_KEY);
      const arr = raw ? JSON.parse(raw) : [];
      if (Array.isArray(arr)) convs = arr.filter((c) => c && Array.isArray(c.messages));
    } catch (e) { /* 存档坏了就当没有,不能让页面开不出来 */ }

    if (convs.length === 0) {
      try {
        const old = JSON.parse(localStorage.getItem(STORE_KEY) || "[]");
        if (Array.isArray(old) && old.length > 0) {
          convs = [{ id: newId(), title: titleOf(old), mode: "campaign", messages: old, updatedAt: Date.now() }];
          migratedOld = true;   // 注意:这里**先不删**旧数据,等新数据确认存好了再删,
        }                       // 否则用户迁移后没发消息就刷新页面 → 历史永久丢失
      } catch (e) { /* 忽略 */ }
    }
    return convs;
  }

  let migratedOld = false;

  function newId() {
    return "c" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  }

  /** 会话标题:取第一句用户说的话,截断;没有就叫"新对话" */
  function titleOf(messages) {
    const first = messages.find((m) => m.role === "user");
    if (!first) return lang === "en" ? "New chat" : "新对话";
    const s = first.content.replace(/\s+/g, " ").trim();
    return s.length > 26 ? s.slice(0, 26) + "…" : s;
  }

  function saveConversations() {
    if (conversations.length > MAX_CONVS) conversations.length = MAX_CONVS;
    // 浏览器每个站点约 5MB 存储空间。攒久了会满 ——
    // 满了不能"悄悄存不进去"(用户会以为记录莫名其妙没了),
    // 要主动腾地方:从最旧的对话开始丢,并且明确告诉用户丢了几个。
    let dropped = 0;
    for (let attempt = 0; attempt < 12; attempt++) {
      try {
        localStorage.setItem(CONVS_KEY, JSON.stringify(conversations));
        localStorage.setItem(CUR_KEY, currentId);
        if (dropped) notifyStorageTrim(dropped);
        pushToServer();            // 登录了就同步到账号里(没登录是空操作)
        return true;
      } catch (e) {
        // 只有当前这个对话了还存不下 → 认输,但要如实告诉用户
        if (conversations.length <= 1) {
          console.warn("对话存盘失败:", e);
          notifyStorageFull();
          return false;
        }
        // 丢掉最旧的一个(数组按更新时间倒序,末尾最旧)
        conversations.pop();
        dropped++;
      }
    }
    return false;
  }

  /** 存储满时腾了地方 —— 必须让用户知道,不能默默丢数据 */
  function notifyStorageTrim(n) {
    if (document.getElementById("storage-tip")) return;   // 同一轮只提示一次
    const tip = document.createElement("div");
    tip.id = "storage-tip";
    tip.className = "restore-tip";
    tip.style.color = "#b54708";
    tip.textContent = t().storageTrimmed(n);
    messagesEl.appendChild(tip);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    setTimeout(() => tip.remove(), 15000);
  }

  function notifyStorageFull() {
    if (document.getElementById("storage-full")) return;
    const tip = document.createElement("div");
    tip.id = "storage-full";
    tip.className = "restore-tip";
    tip.style.color = "#b42318";
    tip.textContent = t().storageFull;
    messagesEl.appendChild(tip);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  // (原来这里有个 saveHistory():把全局 history 写回**当前打开的**那段会话。
  //  正是它让"切走之后回复落错地方"成为可能 —— 已换成 appendMsg(convId, ...),
  //  按会话 id 写,见下面「每段对话各跑各的」那一节。)

  // 缓存里存过 uid,说明这台电脑登录过账号 —— 但现在还不知道**这次**是谁登录的
  // (要等 /api/me 回来)。在确认之前先不把旧记录摆出来,否则换个人登录会
  // 一闪而过地看到上一个人的会话标题。
  const cacheOwned = !!localStorage.getItem(UID_KEY);
  const conversations = cacheOwned ? [] : loadConversations();
  const cachedConvs = cacheOwned ? loadConversations() : null;   // 确认是本人后再用
  let currentId = cacheOwned ? "" : (localStorage.getItem(CUR_KEY) || "");
  if (!conversations.some((c) => c.id === currentId)) {
    currentId = conversations[0] ? conversations[0].id : newId();
  }
  const cur = conversations.find((c) => c.id === currentId);
  const history = cur ? cur.messages.slice() : [];

  // 从老版本迁移过来的:立刻落盘,确认写成功后才删掉旧数据(顺序反了会丢历史)
  if (migratedOld) {
    saveConversations();
    if (localStorage.getItem(CONVS_KEY)) localStorage.removeItem(STORE_KEY);
  }

  const messagesEl = document.getElementById("messages");
  const inputEl = document.getElementById("input");
  const sendBtn = document.getElementById("send");

  // 防止内容里混入 HTML 标签捣乱(只放行无害的 <br> 换行标签)
  function escapeHtml(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
            .replace(/&lt;br\s*\/?&gt;/gi, "<br>");
  }

  // 回复里的域名要能点开 —— 看完竞品落地页的表格,下一步自然是想去看看对方那一页。
  // marked 会把 `www.x.com` 这种反引号内容渲染成 <code>,本身不可点,所以在这里补上。
  //
  // **两条规矩,后一条是硬的**:
  // ① 一律新标签打开(target=_blank + rel=noopener),别把正在聊天的这一页顶掉;
  // ② **追踪链接绝不许变成可点的** —— 点一下 ClickFlare 的 /cf/click 就是一次
  //    **真实点击**,会污染那条 campaign 的统计,而且事后根本看不出来是误点的。
  //    宁可让用户自己复制粘贴,也不能替他制造假数据。
  //    (CLAUDE.md 第六之十七节:不自动访问追踪链接,同一条道理。)
  var HOSTNAME_RE = /^(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,}$/i;
  var URL_RE = /^https?:\/\/[^\s"'<>]+$/i;
  var TRACKING_HINTS = ["/cf/click", "/cf/tags", "cpid=", "cftmid="];

  function looksLikeTracking(s) {
    var t = String(s || "").toLowerCase();
    for (var i = 0; i < TRACKING_HINTS.length; i++) {
      if (t.indexOf(TRACKING_HINTS[i]) >= 0) return true;
    }
    return false;
  }

  function noClickHint() {
    return lang === "en"
      ? "Tracking link — left unclickable on purpose: opening it would count as a real click and pollute this campaign's stats. Copy it if you need it."
      : "追踪链接,故意不做成可点的:点开会算成一次真实点击、污染这条 campaign 的统计。需要的话请复制。";
  }

  function linkifyBubble(bubble) {
    // 已有的链接:统一新标签打开;是追踪链接的话降级成纯文字(仍然看得见、能复制)
    var links = bubble.querySelectorAll ? bubble.querySelectorAll("a[href]") : [];
    for (var i = 0; i < links.length; i++) {
      var a = links[i];
      var href = a.getAttribute ? a.getAttribute("href") : "";
      if (looksLikeTracking(href) || looksLikeTracking(a.textContent)) {
        var code = document.createElement("code");
        code.className = "no-click";
        code.textContent = a.textContent;
        code.title = noClickHint();
        if (a.parentNode) a.parentNode.replaceChild(code, a);
        continue;
      }
      a.setAttribute("target", "_blank");
      a.setAttribute("rel", "noopener noreferrer");
    }
    // 表格里的裸域名(以及整条 http(s) 地址)变成可点的
    var codes = bubble.querySelectorAll ? bubble.querySelectorAll("code") : [];
    for (var j = 0; j < codes.length; j++) {
      var c = codes[j];
      if (c.className === "no-click" || (c.querySelector && c.querySelector("a"))) continue;
      var text = String(c.textContent || "").trim();
      if (!text) continue;
      if (looksLikeTracking(text)) {
        c.className = "no-click";
        c.title = noClickHint();
        continue;
      }
      var isHost = HOSTNAME_RE.test(text);
      if (!isHost && !URL_RE.test(text)) continue;
      var link = document.createElement("a");
      link.href = isHost ? "https://" + text : text;
      link.target = "_blank";
      link.rel = "noopener noreferrer nofollow";
      link.className = "domain-link";
      link.textContent = text;
      c.textContent = "";
      c.appendChild(link);
    }
  }

  // 画一行消息(头像 + 气泡)。who 是 "user" / "bot" / "error"
  function addBubble(who, text) {
    const row = document.createElement("div");
    row.className = "row " + (who === "user" ? "user" : who === "error" ? "error" : "bot");

    const avatar = document.createElement("div");
    avatar.className = "avatar " + (who === "user" ? "user" : "bot");
    // 机器人头像也用同一套线性图标(和顶栏 logo 一致);"我" 是文字,不动
    if (who === "user") avatar.textContent = "我";
    else avatar.innerHTML = LOGO_BOT;

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    if (who === "bot") {
      bubble.dataset.raw = text;      // 存原文,marked 晚到时可以重新排版
      renderBubble(bubble, text);
    } else {
      bubble.textContent = text;
    }

    row.appendChild(avatar);
    row.appendChild(bubble);
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return row;
  }

  /** 把一段文字画进气泡:排版库到了就按 Markdown 排,没到就先按纯文本显示 */
  function renderBubble(bubble, text) {
    if (window.marked) {
      bubble.innerHTML = marked.parse(escapeHtml(text), { breaks: true });
      linkifyBubble(bubble);
    } else {
      bubble.textContent = text;
    }
  }

  // 排版库(marked.js)异步加载完成后回调:把之前按纯文本显示的气泡补排一次版。
  // 这样即使它慢到、甚至加载失败,页面也照样可用,只是表格样式差一点。
  window.onMarkedReady = function () {
    document.querySelectorAll(".row.bot .bubble[data-raw]").forEach((b) => {
      renderBubble(b, b.dataset.raw);
    });
  };

  // 给发送失败的那条消息打上"未送达"标记。
  // 为什么需要:失败时我们会把这句从记忆里撤掉(方便重发),
  // 但气泡还留在屏幕上——不标出来的话,你会以为助手听见了,其实它完全不知道。
  function markUndelivered(row) {
    if (!row) return;
    row.classList.add("undelivered");
    const tag = document.createElement("div");
    tag.className = "undelivered-tag";
    tag.textContent = t().undelivered;
    row.appendChild(tag);
  }

  // "正在思考"的三个小点
  function showTyping() {
    const row = document.createElement("div");
    row.className = "row bot";
    const avatar = document.createElement("div");
    avatar.className = "avatar bot";
    avatar.textContent = "🤖";
    const bubble = document.createElement("div");
    bubble.className = "bubble typing-bubble";
    bubble.innerHTML = "<i></i><i></i><i></i>";
    // 进度文字用真节点建(不写进 innerHTML 字符串):这样才查得到、改得动
    const note = document.createElement("span");
    note.className = "typing-note";
    bubble.appendChild(note);
    row.appendChild(avatar);
    row.appendChild(bubble);
    row._note = note;          // 直接挂上,免得每次都去 querySelector
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return row;
  }

  /** 把「正在查报表…」这类进度写到打字气泡上,让用户知道它在干活而不是卡死 */
  function setTypingNote(row, text) {
    if (!row) return;
    const note = row._note || (row.querySelector && row.querySelector(".typing-note"));
    if (note) note.textContent = text || "";
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  /** 流式过程中,先用一个「纯文本」气泡承接不断到来的字。
   *  为什么不边收边渲染 Markdown:表格写到一半是断的,渲染出来一片乱码,
   *  看着像出错了。所以过程中显示纯文本,收尾时再整体排版一次。 */
  function startStreamBubble() {
    const row = addBubble("bot", "");
    const bubble = row.children[1] || row.lastElementChild;
    return {
      row: row,
      append: function (piece) {
        bubble.textContent = (bubble.textContent || "") + piece;
        messagesEl.scrollTop = messagesEl.scrollHeight;
      },
      clear: function () { bubble.textContent = ""; },
      isEmpty: function () { return !(bubble.textContent || "").trim(); },
      remove: function () { row.remove(); },
    };
  }

  /** 后端明确说明了原因的错误(区别于网络故障)。用 function 声明,会被提升。 */
  function ChatError(message) {
    const e = new Error(String(message));
    e.name = "ChatError";
    return e;
  }

  // ===== 每段对话各跑各的(多线程) =====
  // 以前只有一个全局 busy:一段在等回复,整个页面都锁住,切不了会话。
  // 根子在于「回复写给谁」认的是**当前打开的那段**,你一切走它就落错地方。
  // 现在改成认**当初提问的那段**(convId 在 send 一开始就定死),于是:
  //   · 想切随时切,后台那段照样跑完,回复写回它自己
  //   · 可以同时在几段对话里各问各的
  //   · 屏幕上画不画,只取决于"它是不是正开着"
  const running = new Map();     // convId -> {note, text}  正在生成回复的对话
  const unread = new Set();      // convId  后台跑完了、用户还没看过
  const convError = new Map();   // convId -> 出错信息(它当时没开着,等切回来再给他看)
  let paintSeq = 0;              // 屏幕重画次数。用来判断"我当初拿到的那一行还在屏幕上吗"
  let liveTyping = null;         // 屏幕上那个「思考中」气泡(只属于当前打开的这段)
  let liveStream = null;         // 屏幕上承接流式文字的气泡

  /** 找到某段对话;没有就现建一个(比如刚点了「新对话」还没落盘) */
  function ensureConv(id) {
    let conv = conversations.find((c) => c.id === id);
    if (!conv) {
      conv = { id: id, title: "", mode: "campaign", messages: [], updatedAt: 0 };
      conversations.unshift(conv);
    }
    return conv;
  }

  /** 某段对话的内容变了:更新标题/时间、落盘、重画左栏 */
  function persistConv(conv) {
    if (conv.messages.length > MAX_KEEP) conv.messages.splice(0, conv.messages.length - MAX_KEEP);
    conv.title = titleOf(conv.messages);
    conv.updatedAt = Date.now();
    saveConversations();
    renderConvList();
  }

  /** 往**指定的那段**对话追加一条消息。它可能不是当前开着的那段 ——
   *  那就只写数据、不画屏幕。这是整个"多线程"的关键一步。 */
  function appendMsg(convId, role, content) {
    const conv = ensureConv(convId);
    conv.messages.push({ role: role, content: content });
    let row = null;
    if (convId === currentId) {
      history.length = 0;
      conv.messages.forEach((m) => history.push(m));
      row = addBubble(role === "user" ? "user" : "bot", content);
    }
    persistConv(conv);
    return row;
  }

  /** 撤掉某段对话的最后一条(发送失败时用,方便重发) */
  function popMsg(convId) {
    const conv = ensureConv(convId);
    conv.messages.pop();
    if (convId === currentId) history.pop();
    persistConv(conv);
  }

  /** 把屏幕上的"进行中"气泡清掉(切换会话/收尾时) */
  function clearLive() {
    if (liveStream) { liveStream.remove(); liveStream = null; }
    if (liveTyping) { liveTyping.remove(); liveTyping = null; }
  }

  /** 切回一段还在生成的对话时,照着它自己的状态把进度和已出的字重画出来 */
  function paintRunning(convId) {
    if (convId !== currentId) return;
    const r = running.get(convId);
    if (!r) return;
    liveTyping = showTyping();
    setTypingNote(liveTyping, r.note || "");
    if (r.text) { liveStream = startStreamBubble(); liveStream.append(r.text); }
  }

  // 下面三个:状态一律记在 running 里(切走了也不丢),
  // 只有它正开着才顺手更新屏幕
  function runNote(convId, text) {
    const r = running.get(convId); if (!r) return;
    r.note = text || "";
    if (convId === currentId && liveTyping) setTypingNote(liveTyping, r.note);
  }
  function runAppend(convId, piece) {
    const r = running.get(convId); if (!r) return;
    r.text += (piece || "");
    if (convId === currentId) {
      if (!liveStream) liveStream = startStreamBubble();
      liveStream.append(piece || "");
    }
  }
  function runReset(convId) {
    const r = running.get(convId); if (!r) return;
    r.text = "";       // 模型先说了句开场白又跑去调工具了,那段不是答案
    if (convId === currentId && liveStream) { liveStream.remove(); liveStream = null; }
  }

  async function send(presetText) {
    // 这一轮属于**哪一段**对话,在这里就定死。后面不管用户切到哪儿,
    // 回复都写回这一段 —— 这是"各聊各的"的全部秘密。
    const convId = currentId;

    // 同一段对话里上一条还没回来就别再发了(两份回复、两倍额度、旧上下文);
    // 但**别的对话不受影响**,你可以切过去接着问。
    if (running.has(convId)) {
      // 光改 placeholder 是不够的:**输入框里有字的时候 placeholder 根本不显示**,
      // 用户按了回车会得到零反馈。所以再补一条顶部提示。
      inputEl.placeholder = t().busy;
      setTimeout(() => { inputEl.placeholder = t().placeholder; }, 1800);
      showToast(t().busy);
      return;
    }

    // **没绑账号就一条都发不出去。** 只把输入框和发送键 disabled 是不够的:
    // 快捷提问按钮是直接调 send(q) 的,完全绕过那两个控件。实测就是这样
    // 白白发出去一轮、烧掉一次额度,再拿回一条报错。闸门要设在 send() 里,
    // 以后不管谁调用它都拦得住。
    if (!PLATFORM_BOUND) {
      var nb = document.getElementById("not-bound");
      if (nb && nb.scrollIntoView) nb.scrollIntoView();
      var gb = document.getElementById("go-bind");
      if (gb && gb.focus) gb.focus();
      return;
    }

    const text = (presetText || inputEl.value).trim();
    if (!text) return;

    const chips = document.getElementById("chips");
    if (chips) chips.remove();   // 开始聊天后,收起快捷提问

    inputEl.value = "";
    inputEl.style.height = "auto";
    const userRow = appendMsg(convId, "user", text);   // 失败时要给这一行打标记
    const rowSeq = paintSeq;                          // 记下它是第几次重画时画的
    const msgs = ensureConv(convId).messages.slice();  // 发给后端的是**这一段**的上下文

    running.set(convId, { note: "", text: "" });
    if (convId === currentId) { sendBtn.disabled = true; liveTyping = showTyping(); }
    renderConvList();

    // 超时保护:后端卡死时不要让小点一直转下去。
    // **判据是「多久没动静」,不是「一共等了多久」** —— 原来写死总时长 3 分钟,
    // 于是一次正常但耗时的生成(实测 gpt-5.5 出一整页落地页要 60 秒以上,
    // 加上前面查资料的几轮工具调用轻松破 3 分钟)会被当成"卡死"掐掉,
    // 而用户看到的是「等太久了,这条没发出去」——他以为坏了,其实后端好好的。
    // 只要还在往回吐东西(status / delta),就说明活着,计时器就重来。
    const controller = new AbortController();
    let timer = null;
    const bump = () => {
      if (timer) clearTimeout(timer);
      timer = setTimeout(() => controller.abort(), IDLE_TIMEOUT_MS);
    };
    bump();

    try {
      const body = JSON.stringify({ messages: msgs, lang: lang, mode: ensureConv(convId).mode || "campaign" });
      const common = {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: body,
        signal: controller.signal,
      };

      let res = await fetch("/api/chat/stream", common);

      // 流式接口不可用(旧版后端 404、或被中间的代理拦了)→ 退回一次性接口。
      // 宁可慢一点全须全尾地回来,也不能让用户对着空白页面干等。
      if (!res.ok && (res.status === 404 || res.status === 405)) {
        res = await fetch("/api/chat", common);
        const data = await res.json();
        if (!res.ok) throw new ChatError(data.error || res.status);
        if (convId === currentId) clearLive();   // 只收自己的气泡!别把别人的抹了
        appendMsg(convId, "assistant", data.reply);
        return;
      }

      const ctype = res.headers.get("content-type") || "";
      if (!ctype.includes("text/event-stream")) {
        // 后端直接回了 JSON(多半是出错了)
        const data = await res.json().catch(() => ({}));
        throw new ChatError(data.error || ("HTTP " + res.status));
      }

      // ===== 逐块读 SSE =====
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buf = "", finalReply = null, failed = null;

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        bump();                       // 有动静就重新计时(见上面 IDLE_TIMEOUT_MS)
        buf += decoder.decode(value, { stream: true });

        // SSE 以空行分隔一条事件;最后可能是半条,留在缓冲里等下一块
        const chunks = buf.split("\n\n");
        buf = chunks.pop();
        for (const chunk of chunks) {
          const line = chunk.split("\n").find((l) => l.indexOf("data: ") === 0);
          if (!line) continue;
          let ev;
          try { ev = JSON.parse(line.slice(6)); } catch (e) { continue; }

          if (ev.type === "status") {
            runNote(convId, ev.text);
          } else if (ev.type === "delta") {
            runAppend(convId, ev.text);
          } else if (ev.type === "reset") {
            runReset(convId);
          } else if (ev.type === "done") {
            finalReply = ev.reply;
          } else if (ev.type === "error") {
            failed = ev.error;
          }
        }
      }

      if (failed) throw new ChatError(failed);
      if (finalReply === null) throw new ChatError(t().streamBroken);
      if (convId === currentId) clearLive();   // 过程中的纯文本气泡换成排好版的最终气泡
      appendMsg(convId, "assistant", finalReply);
    } catch (err) {
      if (convId === currentId) clearLive();
      // ChatError = 后端明确告诉我们的原因(钥匙不对、额度用完…),原样转给用户;
      // 其它异常才是"网络问题",别把后端的真实原因盖成"连不上"
      const msg = err.name === "AbortError" ? t().timeout
                : err.name === "ChatError" ? t().errPrefix + err.message
                : t().netErr + err.message;
      popMsg(convId);         // 这轮没成功,撤掉刚才那句,方便重发
      if (convId === currentId && paintSeq === rowSeq) {
        // 那一行还在屏幕上,正常打标记
        addBubble("error", msg);
        markUndelivered(userRow);
      } else if (convId === currentId) {
        // 中途切走又切回来,屏幕重画过 —— userRow 已经掉线,打标记等于打给空气。
        // 那就把原话写进错误里,别让它凭空消失。
        addBubble("error", msg + "\n" + t().lostQ(text));
      } else {
        // 它当时没开着,错误气泡画出来用户也看不到 —— 存起来,等切回去再说。
        convError.set(convId, msg + "\n" + t().lostQ(text));
      }
    } finally {
      clearTimeout(timer);
      running.delete(convId);
      if (convId === currentId) {
        clearLive();
        sendBtn.disabled = false;
        inputEl.focus();
      } else {
        // 后台那段跑完了,用户还在别的对话里 —— 左栏点个蓝点,再提示一句
        unread.add(convId);
        const conv = conversations.find((c) => c.id === convId);
        showToast(t().bgDone((conv && conv.title) || t().untitled));
      }
      renderConvList();
    }
  }

  // 回车发送,Shift+回车换行;输入法组字中的回车(isComposing/229)一律放行
  inputEl.addEventListener("keydown", (e) => {
    if (e.isComposing || e.keyCode === 229) return;
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  });
  inputEl.addEventListener("input", () => {
    inputEl.style.height = "auto";
    inputEl.style.height = inputEl.scrollHeight + "px";
  });
  sendBtn.addEventListener("click", () => send());

  // ===== 素材上传(📎按钮 和 直接粘贴图片 共用这一套) =====
  const attachBtn = document.getElementById("attach");
  const fileInput = document.getElementById("file-input");

  function prettySize(bytes) {
    if (bytes >= 1048576) return (bytes / 1048576).toFixed(1) + " MB";
    if (bytes >= 1024) return Math.round(bytes / 1024) + " KB";
    return bytes + " B";
  }

  async function uploadFile(f) {
    if (!f) return;
    const d = t();
    const info = `${f.name || "(未命名)"} · ${prettySize(f.size || 0)}`;

    // 上传前先自查,能在本地拦下的就别白跑一趟
    if (!f.size) { addBubble("error", d.uploadFail + d.upErrEmpty); return; }
    if (f.size > 100 * 1024 * 1024) {
      addBubble("error", d.uploadFail + d.upErrTooBig(prettySize(f.size)));
      return;
    }
    const kind = (f.type || "").split("/")[0];
    if (f.type && kind !== "image" && kind !== "video") {
      addBubble("error", d.uploadFail + d.upErrWrongType(f.type));
      return;
    }

    attachBtn.disabled = true;
    attachBtn.textContent = "⏳";
    const tip = addBubble("bot", d.upUploading(info));   // 让用户知道正在传、传的是什么

    const form = new FormData();
    form.append("file", f, f.name || "pasted-image.png");

    // 大文件也别无限等:3 分钟没结果就主动放弃并说清楚
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 180000);

    try {
      const res = await fetch("/api/upload", { method: "POST", body: form, signal: ctrl.signal });
      let data = {};
      try { data = await res.json(); } catch (e) { /* 返回的不是 JSON,下面按状态码兜底 */ }
      tip.remove();
      if (!res.ok) {
        // 服务器有话说就照实转达(NewsBreak 的真实原因都在这儿),没话说才用状态码兜底
        const reason = data.error || d.upErrHttp(res.status);
        addBubble("error", `${d.uploadFail}${reason}\n📄 ${info}`);
      } else if (!data.asset_url) {
        addBubble("error", `${d.uploadFail}${d.upErrNoUrl}\n📄 ${info}`);
      } else {
        send(d.uploadedMsg(data.filename, data.asset_url));
      }
    } catch (err) {
      tip.remove();
      // 走到这里是「网络层就失败了」——服务器没给出任何原因,只能解释可能性
      const reason = err.name === "AbortError" ? d.upErrTimeout : d.upErrNetwork(err.message || err.name);
      addBubble("error", `${d.uploadFail}${reason}\n📄 ${info}`);
    } finally {
      clearTimeout(timer);
      attachBtn.disabled = false;
      attachBtn.textContent = "📎";
      fileInput.value = "";
    }
  }

  attachBtn.addEventListener("click", () => fileInput.click());
  fileInput.addEventListener("change", () => uploadFile(fileInput.files[0]));

  // 在输入框里 Ctrl+V / Cmd+V 直接粘贴截图或复制的图片,自动上传
  inputEl.addEventListener("paste", (e) => {
    const items = e.clipboardData ? e.clipboardData.items : [];
    for (const item of items) {
      if (item.type && item.type.startsWith("image/")) {
        e.preventDefault();
        const f = item.getAsFile();
        // 粘贴的图片没有文件名,按它的真实类型起名(别一律叫 .png,
        // 否则 GIF 会被当成普通图片提交给平台)
        const ext = (f.type.split("/")[1] || "png").replace("jpeg", "jpg");
        const named = new File([f], `paste-${Date.now()}.${ext}`, { type: f.type });
        uploadFile(named);
        return;
      }
    }
  });

  // ===== 开场:有存档就恢复,没有才显示欢迎语 + 快捷提问 =====
  function showWelcome() {
    const mode = currentMode(), creative = mode === "creative", landing = mode === "landing";
    const row = addBubble("bot", landing ? t().landingWelcome : creative ? t().creativeWelcome : t().welcome);
    row.dataset.welcome = "1";   // 打标记:切语言时这条要跟着换(它是界面文字,不是对话内容)

    const chipsWrap = document.createElement("div");
    chipsWrap.id = "chips";
    (landing ? t().landingChips : creative ? t().creativeChips : t().chips).forEach((q) => {
      const b = document.createElement("button");
      b.className = "chip";
      b.textContent = q;
      b.onclick = () => send(q);
      chipsWrap.appendChild(b);
    });
    messagesEl.appendChild(chipsWrap);
  }

  /** 开场的欢迎语和快捷提问,按**当前工作室 + 当前语言**重画。返回是不是整段重画了。
   *
   *  **切语言和切工作室改的是同一样东西**(界面文字),所以必须共用一份。
   *  原来这段只长在「切语言」那个监听器里,于是切工作室时:顶栏、副标题、
   *  输入框提示、底部说明全跟着换了,**只有欢迎语和那四个快捷提问还是上一个工作室的**
   *  —— 用户在素材工作室里看到的是「我是你的投放助手」和「哪条广告 CTR 最高」
   *  (2026-09-11 线上实测)。和坑表「同一个判断散在几处,加一种就漏一处」同一条。
   */
  function repaintWelcome() {
    if (history.length === 0) {     // 还没聊过:整段重画,连快捷提问一起换
      messagesEl.innerHTML = "";
      showWelcome();
      return true;
    }
    // 已经聊过:对话内容是历史记录,一个字不动;但开场那条是界面文字,跟着换
    const row = messagesEl.querySelector('.row[data-welcome="1"] .bubble');
    if (row) {
      const mode = currentMode();
      const welcome = mode === "landing" ? t().landingWelcome
                    : mode === "creative" ? t().creativeWelcome : t().welcome;
      row.dataset.raw = welcome;
      renderBubble(row, welcome);
    }
    return false;
  }

  function restoreHistory() {
    history.forEach((m) => addBubble(m.role === "user" ? "user" : "bot", m.content));
    const tip = document.createElement("div");
    tip.className = "restore-tip";
    tip.textContent = t().restoreTip(history.length);
    messagesEl.appendChild(tip);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  // ===== 左侧会话栏 =====
  // 垃圾桶图标(线性风格,和界面其它地方一致)。aria-hidden:图标本身不念给
  // 读屏软件听 —— 按钮的 title 已经写了"删除这个对话"。
  const TRASH_ICON =
    '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" ' +
    'stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
    '<path d="M3 6h18"/>' +
    '<path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/>' +
    '<path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>' +
    '<path d="M10 11v6M14 11v6"/></svg>';

  const convListEl = document.getElementById("conv-list");

  /** 重画左栏列表 */
  function renderConvList() {
    convListEl.innerHTML = "";
    if (conversations.length === 0) {
      const empty = document.createElement("div");
      empty.className = "conv-empty";
      empty.textContent = t().noConvs;
      convListEl.appendChild(empty);
      return;
    }
    conversations.forEach((c) => {
      const item = document.createElement("div");
      item.className = "conv-item" + (c.id === currentId ? " active" : "");
      item.title = c.title;

      // 橙点闪 = 这段正在生成回复;蓝点 = 后台跑完了、你还没看过。
      // 没有这个点的话,"切走之后它还在跑"完全看不出来,用户会以为切走就没了。
      if (running.has(c.id) || unread.has(c.id)) {
        const dot = document.createElement("span");
        dot.className = "conv-dot" + (running.has(c.id) ? " run" : "");
        item.appendChild(dot);
      }

      const title = document.createElement("div");
      title.className = "conv-title";
      title.textContent = c.title || t().untitled;
      item.appendChild(title);

      const kind = document.createElement("span");
      kind.className = "conv-kind" + (c.mode === "creative" ? " creative" : c.mode === "landing" ? " landing" : "");
      kind.textContent = c.mode === "creative" ? t().creativeKind : c.mode === "landing" ? t().landingKind : t().campaignKind;
      item.appendChild(kind);

      const del = document.createElement("button");
      del.className = "conv-del";
      // 垃圾桶图标。**用内联 SVG 不用 emoji 🗑️**:emoji 在 Win/Mac/安卓上
      // 长得都不一样,而且颜色写死改不了 —— 悬停变红这种反馈就做不出来。
      // SVG 用 stroke="currentColor",颜色跟着按钮走,自动变红。
      del.innerHTML = TRASH_ICON;
      del.title = t().deleteConv;
      del.addEventListener("click", (e) => {
        e.stopPropagation();          // 别触发"切换到这个会话"
        deleteConversation(c.id);
      });
      item.appendChild(del);

      item.addEventListener("click", () => switchConversation(c.id));
      convListEl.appendChild(item);
    });
  }

  /** 顶部一闪即逝的提示。用在"这个按钮现在点不了"这类地方 ——
   *  静默 return 是最糟的做法:用户看不出是被拦了还是页面死了。 */
  let toastTimer = null;
  function showToast(msg) {
    const el = document.getElementById("toast");
    if (!el) return;
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 2600);
  }

  // ===== 页面内确认框 =====
  // 监听**只挂一次**(挂在每次弹出时会越积越多,真实 DOM 里一次点击会触发好几遍);
  // 待回应的那个 resolve 存在这儿。
  let confirmResolve = null;

  function closeConfirm(ok) {
    document.getElementById("confirm-overlay").classList.remove("show");
    const r = confirmResolve;
    confirmResolve = null;
    if (r) r(ok);
  }

  /** 弹一个确认框,返回 Promise<boolean>。用法:askConfirm({...}).then(ok => ...) */
  function askConfirm(opts) {
    return new Promise(function (resolve) {
      closeConfirm(false);            // 上一个还开着就先当"取消"关掉,别叠罗汉
      confirmResolve = resolve;
      document.getElementById("confirm-title").textContent = opts.title || "";
      document.getElementById("confirm-text").textContent = opts.text || "";
      document.getElementById("confirm-ok").textContent = opts.ok || t().btnDelete;
      document.getElementById("confirm-cancel").textContent = t().btnCancel;
      // 可选的第三个按钮:**只有传了 opts.alt 才出现**,点它 resolve 成字符串 "alt"。
      // 老调用方一个都没传 alt,所以它们永远只会拿到 true/false,行为不变。
      const alt = document.getElementById("confirm-alt");
      if (alt) {
        if (opts.alt) { alt.textContent = opts.alt; alt.hidden = false; }
        else { alt.hidden = true; }
      }
      // 垃圾桶图标是给「删除」用的,切工作室这类非破坏性操作不该顶着它
      const icon = document.getElementById("confirm-icon");
      if (icon) icon.hidden = opts.icon === false;
      document.getElementById("confirm-overlay").classList.add("show");
      // 焦点:删除这类**不可逆**操作给「取消」(回车不该正好落在危险按钮上);
      // 有 alt 的是非破坏性选择题,给推荐的那个,回车即可。
      const c = (opts.alt && alt) ? alt : document.getElementById("confirm-cancel");
      if (c.focus) c.focus();
    });
  }

  document.getElementById("confirm-ok").addEventListener("click", () => closeConfirm(true));
  document.getElementById("confirm-alt").addEventListener("click", () => closeConfirm("alt"));
  document.getElementById("confirm-cancel").addEventListener("click", () => closeConfirm(false));
  document.getElementById("confirm-overlay").addEventListener("click", (e) => {
    if (e.target === document.getElementById("confirm-overlay")) closeConfirm(false);   // 点空白 = 取消
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && confirmResolve) closeConfirm(false);
  });

  /** 把屏幕上的消息重画成某个会话的内容 */
  function paintCurrent() {
    paintSeq++;                                // 屏幕重画过 → 之前拿到的行号都作废
    messagesEl.innerHTML = "";
    liveTyping = null; liveStream = null;     // 上面那一下已经把它们从屏幕上抹掉了
    if (history.length > 0) restoreHistory();
    else showWelcome();
    // 切回来的时候,它可能还在生成 —— 把进度和已经出的字照原样接上
    paintRunning(currentId);
    // 也可能是它在后台出错了(当时没开着,错误气泡没地方画)—— 现在补给用户看
    const err = convError.get(currentId);
    if (err) { convError.delete(currentId); addBubble("error", err); }
  }

  /** 切到另一段对话。**随时可切**,哪怕这边还在生成 ——
   *  那段会在后台跑完,回复写回它自己(见 send 里的 convId)。 */
  function switchConversation(id) {
    if (id === currentId) return;
    const conv = conversations.find((c) => c.id === id);
    if (!conv) return;
    clearLive();                 // 先把这一段的"进行中"气泡收走(它的状态在 running 里存着)
    currentId = id;
    unread.delete(id);           // 看过了,左栏那个蓝点撤掉
    history.length = 0;
    conv.messages.forEach((m) => history.push(m));
    localStorage.setItem(CUR_KEY, currentId);
    applyLang();
    paintCurrent();
    renderConvList();
    sendBtn.disabled = running.has(currentId);   // 这一段自己在忙才禁用
    inputEl.focus();
  }

  function deleteConversation(id) {
    // 只挡**它自己**还在生成的那一段:删了的话回复回来会把它又建出来,
    // 用户看着像"删不掉"。别的对话在跑不影响删这一段。
    if (running.has(id)) { showToast(t().busyDelete); return; }
    askConfirm({ title: t().confirmDeleteTitle, text: t().confirmDelete, ok: t().btnDelete })
      .then((yes) => { if (yes) doDeleteConversation(id); });
  }

  /** 真正动手删(确认之后才走到这儿) */
  function doDeleteConversation(id) {
    const idx = conversations.findIndex((c) => c.id === id);
    if (idx === -1) return;
    conversations.splice(idx, 1);

    if (id === currentId) {
      // 删的是当前打开的:切到下一个,没有了就开个空的
      const next = conversations[0];
      currentId = next ? next.id : newId();
      history.length = 0;
      if (next) next.messages.forEach((m) => history.push(m));
      clearLive();
      applyLang();
      paintCurrent();
      sendBtn.disabled = running.has(currentId);
    }
    saveConversations();
    renderConvList();
  }

  /** 开新对话:当前这段已经在 conversations 里了,只要新开一个空的即可(不删任何东西) */
  function startNewConversation(mode) {
    mode = ["campaign", "creative", "landing"].includes(mode) ? mode : currentMode();
    if (history.length === 0 && currentMode() === mode) return;
    clearLive();                          // 那一段还在跑也没关系,它自己会跑完
    currentId = newId();
    ensureConv(currentId).mode = mode;
    history.length = 0;
    localStorage.setItem(CUR_KEY, currentId);
    saveConversations();
    applyLang();
    paintCurrent();
    renderConvList();
    sendBtn.disabled = false;             // 新的这段是空的,当然能发
    inputEl.focus();
  }

  applyLang();                       // 先把界面刷成当前语言
  paintCurrent();
  renderConvList();

  document.getElementById("new-chat").addEventListener("click", () => startNewConversation(currentMode()));
  /**
   * 顶栏切工作室。
   *
   * **原来是直接 startNewConversation(mode) —— 上下文静默丢光。**
   * 助手让用户「去素材工作室」,他切过去发现刚才聊的全没了,
   * 这才是死胡同真正让人绝望的地方(线上实测)。
   * 现在:空对话原地切(不在左栏留一堆空壳);有内容就问一句,让他自己决定。
   */
  function switchStudio(mode) {
    mode = ["campaign", "creative", "landing"].includes(mode) ? mode : currentMode();
    if (currentMode() === mode) return;          // 已经在这个工作室了
    const carry = () => {                        // 同一段对话,只换视角
      ensureConv(currentId).mode = mode;
      saveConversations();
      applyLang();
      repaintWelcome();          // 欢迎语和快捷提问也要跟着换工作室
      renderConvList();
      if (inputEl.focus) inputEl.focus();
    };
    if (history.length === 0) return carry();    // 空的没什么可带,直接切
    // **那一段还在生成时不给「带过去」**:在飞的那个请求带的是旧视角,
    // 半路换挡只会让用户以为切了却没切。让他另开一段,并说清为什么。
    const busyNow = running.has(currentId);
    askConfirm({
      icon: false,
      title: t().studioSwitchTitle.replace("{s}", t()["mode_" + mode]),
      text: busyNow ? t().studioSwitchBusy : t().studioSwitchText,
      ok: t().studioSwitchNew,
      alt: busyNow ? "" : t().studioSwitchCarry,
    }).then((res) => {
      if (res === "alt") carry();
      else if (res === true) startNewConversation(mode);
    });
  }

  document.getElementById("campaign-mode").addEventListener("click", () => switchStudio("campaign"));
  document.getElementById("creative-mode").addEventListener("click", () => switchStudio("creative"));
  document.getElementById("landing-mode").addEventListener("click", () => switchStudio("landing"));

  document.getElementById("sidebar-toggle").addEventListener("click", () => {
    document.getElementById("sidebar").classList.toggle("collapsed");
  });

  // 🌐 中英文切换:界面文案立刻换;已有的对话内容保持原样(那是历史记录,
  // 不该改写),新的回复会用新语言 —— 后端会收到 lang 并切换 AI 的语言。
  document.getElementById("lang-toggle").addEventListener("click", () => {
    const wasBusy = running.has(currentId);   // 这一段还有回复在路上?那条用的是旧语言
    lang = lang === "zh" ? "en" : "zh";
    localStorage.setItem(LANG_KEY, lang);
    applyLang();

    // 开场页(还没聊过)整个重画,让欢迎语和快捷提问都换语言;
    // 聊过了就只换开场那条(对话内容是历史记录,不改写)
    if (repaintWelcome()) {
      inputEl.focus();
      return;
    }

    // 提示语:同一条反复切换时替换掉旧提示,不要堆一串
    let tip = messagesEl.lastElementChild;
    if (!tip || !tip.classList.contains("switch-tip")) {
      tip = document.createElement("div");
      tip.className = "restore-tip switch-tip";
      messagesEl.appendChild(tip);
    }
    tip.textContent = lang === "en"
      ? "— Switched to English. New replies will be in English —"
      : "— 已切换为中文,接下来的回复会用中文 —";

    // 关键提醒:切换前发出的那条请求,回来时仍是旧语言(不是切换失效)
    if (wasBusy) {
      const warn = document.createElement("div");
      warn.className = "restore-tip switch-tip";
      warn.textContent = lang === "en"
        ? "(The reply already on its way was requested in Chinese, so it will arrive in Chinese.)"
        : "(切换前发出的那条请求仍会用英文回复,这是正常的,不是切换没生效。)";
      messagesEl.appendChild(warn);
    }
    messagesEl.scrollTop = messagesEl.scrollHeight;
    inputEl.focus();
  });

  // ===== 🔗 广告账户接入 =====
  // 注意:acctReady 用 var 声明(var 会提升并初始化为 undefined),
  // 这样 applyLang() 在本模块初始化之前读它是安全的。
  acctReady = false;
  const acctBtn = document.getElementById("acct-btn");
  const acctOverlay = document.getElementById("acct-overlay");
  const acctBody = document.getElementById("acct-body");
  const acctMsg = document.getElementById("acct-msg");
  let acctState = null;          // 最近一次从后端拿到的接入状态
  let showTokenForm = false;     // 是否正在显示"填 Token"表单

  function setAcctMsg(text, kind) {
    acctMsg.textContent = text || "";
    acctMsg.className = "modal-msg" + (kind ? " " + kind : "");
  }

  // 顶栏按钮:接入了显示账户名,没接入显示醒目的橙色提示
  function renderAcctBtn() {
    const d = t();
    if (acctState && acctState.connected) {
      const active = (acctState.accounts || []).find((a) => a.id === acctState.active_account_id);
      const name = active ? active.name : d.acctBtn;
      const shortName = name.length > 8 ? name.slice(0, 8) + "…" : name;
      setBtnLabel("acct-btn", (lang === "en" ? "Account · " : "账户 · ") + shortName);
      acctBtn.className = "tool-btn linked";
    } else {
      setBtnLabel("acct-btn", lang === "en" ? "Connect account" : "账户管理");
      acctBtn.className = "tool-btn unlinked";
    }
    // 图标按钮上看不见文字了，但「现在连的是哪个账户」是有用的信息 —— 放进悬停提示
    acctBtn.title = (acctState && acctState.connected
                     ? (acctState.accounts || []).map(function (a) {
                         return a.id === acctState.active_account_id ? "● " + a.name : null;
                       }).filter(Boolean).join("") + " · "
                     : "") + d.acctBtnTitle;
  }

  // 弹窗内容:根据"接没接入"渲染两种界面
  function renderAcctModal() {
    const d = t();
    setBtnLabel("acct-title", d.acctTitle);
    document.getElementById("acct-close").textContent = d.acctClose;
    const linked = acctState && acctState.connected;
    document.getElementById("acct-desc").textContent = linked ? d.acctDescLinked : d.acctDescUnlinked;
    acctBody.innerHTML = "";

    // ① 没接入(或点了"更换 Token"):显示填写表单
    if (!linked || showTokenForm) {
      if (acctState && acctState.error) {
        const bad = document.createElement("div");
        bad.className = "acct-status bad";
        bad.textContent = "⚠️ " + d.acctTokenBad;
        acctBody.appendChild(bad);
      }
      const label = document.createElement("label");
      label.textContent = d.acctTokenLabel;
      const input = document.createElement("input");
      input.type = "password";
      input.id = "acct-token-input";
      input.placeholder = d.acctTokenPlaceholder;
      const help = document.createElement("div");
      help.className = "desc";
      help.style.marginTop = "8px";
      help.textContent = d.acctTokenHelp;
      const save = document.createElement("button");
      save.className = "btn-primary";
      save.style.marginTop = "14px";
      save.textContent = d.acctSave;
      save.onclick = async () => {
        const token = input.value.trim();
        if (!token) return;
        save.disabled = true;
        save.textContent = d.acctSaving;
        setAcctMsg("");
        try {
          const res = await fetch("/api/account/token", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ token }),
          });
          const data = await res.json();
          if (!res.ok) {
            setAcctMsg(data.error || "保存失败", "err");
          } else {
            acctState = data;
            showTokenForm = false;
            setAcctMsg(d.acctSaved, "ok");
            renderAcctBtn();
            renderAcctModal();
            refreshPlatformBinding();   // 绑上了就把聊天界面解锁,不用用户手动刷新
            return;
          }
        } catch (e) {
          setAcctMsg(String(e), "err");
        }
        save.disabled = false;
        save.textContent = d.acctSave;
      };
      acctBody.appendChild(label);
      acctBody.appendChild(input);
      acctBody.appendChild(help);
      acctBody.appendChild(save);
      setTimeout(() => input.focus(), 50);
      return;
    }

    // ② 已接入:显示组织 + 账户列表(可点击切换)
    const org = (acctState.organizations || [])[0];
    const status = document.createElement("div");
    status.className = "acct-status";
    status.textContent = `✅ ${d.acctConnected} · ${d.acctOrgLabel}:${org ? org.name : "-"}`;
    acctBody.appendChild(status);

    const label = document.createElement("label");
    label.textContent = d.acctPickLabel;
    acctBody.appendChild(label);

    const list = document.createElement("div");
    list.className = "acct-list";
    (acctState.accounts || []).forEach((a) => {
      const item = document.createElement("div");
      item.className = "acct-item" + (a.id === acctState.active_account_id ? " active" : "");
      const dot = document.createElement("span");
      dot.textContent = a.id === acctState.active_account_id ? "🟢" : "⚪️";
      const name = document.createElement("span");
      name.textContent = a.name;
      const aid = document.createElement("span");
      aid.className = "aid";
      aid.textContent = a.id;
      item.append(dot, name, aid);
      item.onclick = async () => {
        if (a.id === acctState.active_account_id) return;
        setAcctMsg("");
        try {
          const res = await fetch("/api/account/select", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ account_id: a.id }),
          });
          const data = await res.json();
          if (!res.ok) { setAcctMsg(data.error || "切换失败", "err"); return; }
          acctState = data;
          setAcctMsg(d.acctSwitched, "ok");
          renderAcctBtn();
          renderAcctModal();
        } catch (e) {
          setAcctMsg(String(e), "err");
        }
      };
      list.appendChild(item);
    });
    acctBody.appendChild(list);

    const change = document.createElement("button");
    change.className = "ghost-btn";
    change.style.marginTop = "16px";
    change.textContent = d.acctChange + "(" + acctState.token_masked + ")";
    change.onclick = () => { showTokenForm = true; setAcctMsg(""); renderAcctModal(); };
    acctBody.appendChild(change);
  }

  async function refreshAcct() {
    try {
      const res = await fetch("/api/account");
      acctState = await res.json();
    } catch (e) {
      acctState = { connected: false };
    }
    renderAcctBtn();
  }

  acctBtn.addEventListener("click", () => {
    showTokenForm = false;
    setAcctMsg("");
    renderAcctModal();
    acctOverlay.classList.add("show");
    refreshAcct().then(renderAcctModal);   // 打开时顺便刷新一次最新状态
  });
  document.getElementById("acct-close").addEventListener("click", () => acctOverlay.classList.remove("show"));
  acctOverlay.addEventListener("click", (e) => { if (e.target === acctOverlay) acctOverlay.classList.remove("show"); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") acctOverlay.classList.remove("show"); });

  acctReady = true;   // 到这里账户模块的变量和函数才真正可用
  refreshAcct();      // 页面打开时先查一次,顶栏按钮立刻显示当前账户

  // ===== 账号同步:登录后聊天记录存在服务器上,跟着账号走 =====
  var serverUser = "";       // 当前登录的用户名(空=没启用登录/没登录)
  var pushTimer = null;

  /** 把本地记录推到服务器(攒 1 秒再发,避免每敲一句就请求一次) */
  function pushToServer() {
    if (!serverUser) return;
    clearTimeout(pushTimer);
    pushTimer = setTimeout(function () {
      fetch("/api/chats", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ conversations: conversations }),
      }).catch(function (e) { console.warn("同步到账号失败:", e); });
    }, 1000);
  }

  /** 开机时和服务器对一次账:服务器有就用服务器的,服务器空就把本地的传上去 */
  function syncFromServer() {
    fetch("/api/me")
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d.username) return;                     // 没启用登录 → 保持纯本地模式
        serverUser = d.username;
        renderUserChip();

        // 本地缓存是不是这个人的?同一台电脑换账号登录时,
        // 缓存里躺着的是**上一个人**的记录 —— 既不能显示给他看,
        // 更不能当成"他的未同步记录"上传到他账号里(那是跨账号泄露)。
        var uid = d.id || d.username;
        var cachedUid = localStorage.getItem(UID_KEY) || "";
        if (cachedUid && cachedUid !== uid) {
          conversations.length = 0;
          currentId = "";
          history.length = 0;
          try {
            localStorage.removeItem(CONVS_KEY);
            localStorage.removeItem(CUR_KEY);
          } catch (e) { /* 清不掉也不影响:下面以服务器为准 */ }
          messagesEl.innerHTML = "";
          showWelcome();
          renderConvList();
        }
        else if (cachedConvs && cachedConvs.length && !conversations.length) {
          // 确认就是本人 → 把刚才按住没显示的缓存放回去(服务器要是挂了还能看历史)
          Array.prototype.push.apply(conversations, cachedConvs);
          currentId = localStorage.getItem(CUR_KEY) || (conversations[0] || {}).id || "";
          renderConvList();   // 放回去要重画,否则左栏一直显示"还没有对话记录"
        }
        try { localStorage.setItem(UID_KEY, uid); } catch (e) {}
        return fetch("/api/chats").then(function (r) { return r.json(); }).then(function (data) {
          var remote = (data && data.conversations) || [];
          if (remote.length > 0) {
            // 服务器上有 → 以服务器为准(这样换电脑登录也能看到)。
            // **必须原地替换,不能 `conversations = remote`** —— 它是 const,
            // 赋值会抛 TypeError,而这个异常正好被最外层 .catch 吞掉,
            // 表现为:左栏空着、服务器上的历史永远读不回来,接着第一条新消息
            // 一发就把服务器那份覆盖成本地这份。数据就是这么丢的。
            // 而且别处(pushToServer 等)持有的是这个数组对象本身,换个对象也接不上。
            conversations.length = 0;
            Array.prototype.push.apply(conversations, remote);
            currentId = (conversations[0] && conversations[0].id) || "";
            history.length = 0;
            var cur = conversations.find(function (c) { return c.id === currentId; });
            if (cur) Array.prototype.push.apply(history, cur.messages || []);
            try {
              localStorage.setItem(CONVS_KEY, JSON.stringify(conversations));
              localStorage.setItem(CUR_KEY, currentId);
            } catch (e) { /* 本地缓存存不下不影响主流程 */ }
            messagesEl.innerHTML = "";
            if (history.length) restoreHistory(); else showWelcome();
            renderConvList();
          } else if (conversations.length > 0) {
            // 服务器还空着,但本地有 → 把本地的传上去,不丢老记录
            pushToServer();
          }
        });
      })
      .catch(function (e) {
        // **不能只 console.warn**:同步失败时用户看到的是"记录空了",
        // 而接下来他一发消息就会把服务器那份覆盖掉。必须让他看见,并且
        // 明确告诉他先别发消息。(这个 catch 曾经吞掉了一个 const 赋值的
        // TypeError,导致服务器历史读不回来又被悄悄覆盖。)
        console.warn("读取账号信息失败:", e);
        try {
          var warn = document.createElement("div");
          warn.className = "restore-tip";
          warn.style.color = "#b42318";
          warn.textContent = t().syncFailed;
          messagesEl.appendChild(warn);
          messagesEl.scrollTop = messagesEl.scrollHeight;
        } catch (_) { /* 连提示都建不出来就算了,别再抛一次 */ }
      });
  }

  function renderUserChip() {
    var chip = document.getElementById("user-chip");
    if (!chip || !serverUser) return;
    chip.style.display = "";
    chip.textContent = "👤 " + serverUser;
    chip.title = "点击退出登录";
    chip.style.cursor = "pointer";
    chip.onclick = function () {
      askConfirm({ title: t().confirmLogoutTitle, text: t().confirmLogout, ok: t().btnLogout })
        .then(function (yes) {
          if (!yes) return;
          fetch("/api/logout", { method: "POST" }).finally(function () { location.href = "/login"; });
        });
    };
  }

  // ===== 平台信息:更新副标题;没绑账号就明确挡一道 =====
  function loadPlatform() {
    fetch("/api/platforms")
      .then(function (r) { return r.json(); })
      .then(function (data) {
        var p = (data.platforms || []).find(function (x) { return x.id === PLATFORM; });
        if (!p) return;
        PLATFORM_NAME = p.name;
        PLATFORM_BOUND = !!p.bound;
        applyLang();                       // 副标题里的 {p} 换成真实平台名
        document.getElementById("platform-btn").title = t().switchPlatform;
        // `bind=1` 表达的是「带我去绑定」这个**意图**,不代表真的没绑。
        // 这两件事以前混在一起(`!PLATFORM_BOUND || WANT_BIND` 一起走 showNotBound),
        // 而 showNotBound 里是**无条件停用输入框**的 —— 于是已经绑好的用户,
        // 只要地址里带着 bind=1(平台页点「先绑定账号」进来,或把这个地址刷新/收藏了),
        // 就被**永久锁住**:顶栏明明显示着账户名,输入框却说"还没绑定"。线上实测到的。
        if (!PLATFORM_BOUND) {
          showNotBound(p);                     // 真没绑:提示 + 停用输入
        } else if (WANT_BIND && acctReady) {
          // 已经绑了、只是想改:直接把账户弹窗打开,什么都不锁,也不弹"还没绑定"
          // (对一个绑好的人说"你还没绑",本身就是错的)
          var ab = document.getElementById("acct-btn");
          if (ab && ab.click) ab.click();
        }
        if (WANT_BIND) { WANT_BIND = false; stripBindParam(); }
      })
      .catch(function (e) { console.warn("读取平台信息失败:", e); });
  }

  /** 把地址里的 bind=1 去掉。不去掉的话,用户每刷新一次都要再走一遍引导 ——
   *  而这个地址很容易被收藏或留在标签页里。 */
  function stripBindParam() {
    try {
      var u = new URL(location.href);
      u.searchParams.delete("bind");
      history.replaceState(null, "", u.pathname + u.search + u.hash);
    } catch (e) { /* 测试环境或老浏览器没有 history,忽略 */ }
  }

  /** 没绑定账号:在聊天区顶部贴一条醒目提示,并把输入框停用 */
  function showNotBound(p) {
    var d = t();
    var row = document.createElement("div");
    row.className = "row bot";
    row.id = "not-bound";
    var body = d.notBoundBody.replace(/\{p\}/g, p.name);
    var hint = lang === "en" ? p.bind_hint_en : p.bind_hint_zh;
    row.innerHTML =
      "<div class=\"avatar bot\">" + LOGO_BOT + "</div>" +
      '<div class="bubble" style="border-color:#d97706">' +
        '<strong>⚠️ ' + escapeHtml(d.notBoundTitle.replace(/\{p\}/g, p.name)) + '</strong>' +
        '<p>' + escapeHtml(body) + '</p>' +
        (hint ? '<p style="font-size:12.5px;opacity:.8">' + escapeHtml(hint) + '</p>' : '') +
        '<button class="ghost-btn" id="go-bind" style="margin-top:6px">' + escapeHtml(d.notBoundBtn) + '</button>' +
      '</div>';
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    var btn = document.getElementById("go-bind");
    if (btn) btn.onclick = function () { document.getElementById("acct-btn").click(); };
    // 没绑定就别让用户白打字
    inputEl.disabled = true;
    inputEl.placeholder = d.notBoundTitle.replace(/\{p\}/g, p.name);
    sendBtn.disabled = true;
    setChipsEnabled(false);   // 快捷提问也要一起停,否则点了只是"没反应"
  }

  /** 快捷提问按钮跟着绑定状态开关。点了没反应很难查,置灰能一眼看懂。 */
  function setChipsEnabled(on) {
    var wrap = document.getElementById("chips");
    if (!wrap) return;
    var kids = wrap.children || [];
    for (var i = 0; i < kids.length; i++) {
      kids[i].disabled = !on;
      kids[i].style.opacity = on ? "" : ".45";
      kids[i].style.cursor = on ? "" : "not-allowed";
    }
  }

  /** 存完 token 后回头问一次后端:这个平台现在算绑定了吗?算就把界面放开。
   *  特意不"存成功就直接放开"——以后端的 bound() 为准,才不会界面和实际不一致。*/
  function refreshPlatformBinding() {
    fetch("/api/platforms")
      .then(function (r) { return r.json(); })
      .then(function (data) {
        var p = (data.platforms || []).find(function (x) { return x.id === PLATFORM; });
        if (p && p.bound) clearNotBound(p);
      })
      .catch(function (e) { console.warn("回查平台绑定状态失败:", e); });
  }

  /** 撤掉 ⚠️ 提示、解锁输入框,并在聊天区说一句,让用户立刻知道成了 */
  function clearNotBound(p) {
    if (PLATFORM_BOUND) return;          // 本来就没锁,不用重复说
    PLATFORM_BOUND = true;
    var row = document.getElementById("not-bound");
    if (row && row.remove) row.remove();
    inputEl.disabled = false;
    sendBtn.disabled = false;
    setChipsEnabled(true);
    inputEl.placeholder = t().placeholder;
    addBubble("bot", t().boundOk.replace(/\{p\}/g, (p && p.name) || PLATFORM_NAME));
    inputEl.focus();
  }

  loadPlatform();

  // ===== 图片放大 =====
  // 聊天里的素材缩略图只有 100~160px(表格里更小),而"看清竞品的画面长什么样"
  // 正是这个功能的意义所在。所以任何一张图都能点开看原图。
  //
  // **用事件委托挂在消息区上,不是给每张图单独绑**:图片是 AI 回复渲染出来的,
  // 每次新消息都会产生新的 img 节点,逐个绑定就得在每次渲染后再跑一遍,漏一次就失灵。
  // 委托到父节点上,以后不管怎么渲染都自动生效。
  var lightboxReady = false;
  const lbox = document.getElementById("lightbox");
  const lboxImg = document.getElementById("lightbox-img");

  function openLightbox(src, alt) {
    const d = I18N[lang];
    lboxImg.src = src;
    lboxImg.alt = alt || "";
    document.getElementById("lightbox-size").textContent = d.imgLoading;
    const link = document.getElementById("lightbox-open");
    link.href = src;
    link.textContent = d.imgOpenNew;
    lbox.classList.add("show");
  }

  function closeLightbox() {
    lbox.classList.remove("show");
    lboxImg.removeAttribute("src");   // 别让大图一直占着内存
  }

  // 原图加载完才知道真实尺寸,顺手告诉用户 —— 判断素材能不能用得看清晰度
  lboxImg.addEventListener("load", function () {
    const w = lboxImg.naturalWidth, h = lboxImg.naturalHeight;
    document.getElementById("lightbox-size").textContent = w && h ? w + " × " + h : "";
  });
  lboxImg.addEventListener("error", function () {
    document.getElementById("lightbox-size").textContent = "😕";
  });

  messagesEl.addEventListener("click", function (e) {
    const t = e.target;
    if (t && t.tagName === "IMG" && t.src) openLightbox(t.src, t.alt);
  });
  document.getElementById("lightbox-close").addEventListener("click", closeLightbox);
  lbox.addEventListener("click", function (e) {
    if (e.target === lbox) closeLightbox();   // 点空白处关掉,点图本身不关
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && lbox.classList.contains("show")) closeLightbox();
  });
  lightboxReady = true;

  syncFromServer();

  inputEl.focus();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>广告投放小助手</title>
  <!-- 站点图标:对话气泡 + 上升柱状 = 用聊天管广告数据。
       SVG 优先(任意尺寸都清晰),PNG 兜底给不认 SVG 图标的老 Safari。 -->
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="alternate icon" href="/static/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <meta name="theme-color" content="#4f6ef7">
<style>
  /* ============ 设计变量:一处改色,全站生效 ============ */
  :root {
    --bg: #eef1f6;                /* 页面底色 */
    --panel: #ffffff;             /* 面板/气泡底色 */
    --text: #1d2129;
    --muted: #7a8190;
    --accent1: #4f6ef7;           /* 主题渐变的两端 */
    --accent2: #7b5ff5;
    --bot-bubble: #ffffff;
    --border: #e4e8ef;
    --shadow: 0 1px 3px rgba(16, 24, 40, .07), 0 6px 16px -6px rgba(16, 24, 40, .08);
    --chip-bg: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1015; --panel: #171a21; --text: #e9ebef; --muted: #8b93a1;
      --accent1: #5b7cff; --accent2: #8b6cf8;
      --bot-bubble: #1c2029; --border: #262b36;
      --shadow: 0 1px 3px rgba(0,0,0,.4), 0 6px 16px -6px rgba(0,0,0,.5);
      --chip-bg: #1c2029;
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background:
      radial-gradient(1000px 500px at 15% -10%, color-mix(in srgb, var(--accent1) 14%, transparent), transparent 60%),
      radial-gradient(900px 500px at 90% -10%, color-mix(in srgb, var(--accent2) 12%, transparent), transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    display: flex; flex-direction: column; height: 100dvh;
  }

  /* ============ 顶栏 ============ */
  header {
    flex-shrink: 0;
    display: flex; align-items: center; gap: 12px;
    padding: 12px clamp(16px, 4vw, 40px);
    background: color-mix(in srgb, var(--panel) 82%, transparent);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 10;
  }
  .logo {
    width: 38px; height: 38px; border-radius: 12px; flex-shrink: 0;
    background: linear-gradient(135deg, var(--accent1), var(--accent2));
    display: grid; place-items: center; font-size: 20px;
    box-shadow: 0 4px 12px -2px color-mix(in srgb, var(--accent1) 45%, transparent);
  }
  .title-wrap h1 { font-size: 15.5px; font-weight: 700; letter-spacing: .2px; }
  .title-wrap .sub { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 5px; margin-top: 1px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 0 3px color-mix(in srgb, #22c55e 20%, transparent); }
  header .right { margin-left: auto; font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 12px; }

  /* ============ 主体:左侧会话栏 + 右侧聊天区 ============ */
  .main { flex: 1; display: flex; min-height: 0; }

  #sidebar {
    width: 232px; flex-shrink: 0; display: flex; flex-direction: column;
    border-right: 1px solid var(--border);
    background: color-mix(in srgb, var(--panel) 55%, transparent);
    transition: width .18s ease, opacity .18s ease;
  }
  #sidebar.collapsed { width: 0; opacity: 0; overflow: hidden; border-right: 0; }
  .sidebar-head {
    padding: 12px 12px 8px; font-size: 11.5px; color: var(--muted);
    letter-spacing: .3px; text-transform: uppercase; flex-shrink: 0;
  }
  #conv-list { flex: 1; overflow-y: auto; padding: 0 8px 12px; display: flex; flex-direction: column; gap: 3px; }
  .conv-item {
    display: flex; align-items: center; gap: 6px;
    padding: 8px 10px; border-radius: 9px; cursor: pointer;
    font-size: 13px; color: var(--text); transition: background .12s ease;
  }
  .conv-item:hover { background: color-mix(in srgb, var(--accent1) 9%, transparent); }
  .conv-item.active { background: color-mix(in srgb, var(--accent1) 15%, transparent); font-weight: 600; }
  .conv-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .conv-del {
    flex-shrink: 0; border: 0; background: transparent; color: var(--muted);
    cursor: pointer; font-size: 14px; line-height: 1; padding: 2px 4px; border-radius: 5px;
    opacity: 0; transition: opacity .12s ease;
  }
  .conv-item:hover .conv-del { opacity: 1; }
  .conv-del:hover { color: #dc2626; background: color-mix(in srgb, #ef4444 12%, transparent); }
  .conv-empty { padding: 10px; font-size: 12px; color: var(--muted); line-height: 1.6; }

  .chat-area { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }

  /* 窄屏:左栏默认收起,用 ☰ 打开时浮在上层 */
  @media (max-width: 820px) {
    #sidebar {
      position: fixed; top: 63px; bottom: 0; left: 0; z-index: 20;
      background: var(--panel); box-shadow: var(--shadow);
    }
  }
  .ghost-btn {
    background: var(--panel); border: 1px solid var(--border); color: var(--muted);
    border-radius: 999px; padding: 6px 13px; font-size: 12.5px; cursor: pointer;
    transition: all .15s ease; white-space: nowrap;
  }
  .ghost-btn:hover { border-color: var(--accent1); color: var(--accent1); }
  @media (max-width: 640px) { .tagline { display: none; } }

  /* ============ 消息区 ============ */
  #messages {
    flex: 1; overflow-y: auto;
    padding: 24px clamp(16px, 4vw, 40px) 12px;
    display: flex; flex-direction: column; gap: 18px;
    scroll-behavior: smooth;
  }
  #messages > * { width: 100%; max-width: 920px; margin-left: auto; margin-right: auto; flex-shrink: 0; }

  /* 一行消息 = 头像 + 气泡 */
  .row { display: flex; gap: 10px; align-items: flex-end; animation: rise .25s ease both; }
  .row.user { flex-direction: row-reverse; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  .avatar {
    width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
    display: grid; place-items: center; font-size: 16px; font-weight: 600;
    box-shadow: var(--shadow);
  }
  .avatar.bot { background: linear-gradient(135deg, var(--accent1), var(--accent2)); }
  .avatar.user { background: var(--panel); border: 1px solid var(--border); font-size: 13px; color: var(--muted); }

  .bubble {
    max-width: min(76%, 700px);
    padding: 11px 15px; border-radius: 16px;
    line-height: 1.65; font-size: 14.5px; word-break: break-word;
  }
  .row.user .bubble {
    background: linear-gradient(135deg, var(--accent1), var(--accent2));
    color: #fff; border-bottom-right-radius: 5px;
    box-shadow: 0 4px 14px -4px color-mix(in srgb, var(--accent1) 55%, transparent);
    white-space: pre-wrap;
  }
  .row.bot .bubble {
    background: var(--bot-bubble); border: 1px solid var(--border);
    border-bottom-left-radius: 5px; box-shadow: var(--shadow);
    max-width: min(88%, 820px); overflow-x: auto;
  }
  .row.error .bubble {
    background: color-mix(in srgb, #ef4444 10%, var(--panel));
    border: 1px solid color-mix(in srgb, #ef4444 35%, transparent);
    color: #dc2626; border-bottom-left-radius: 5px; white-space: pre-wrap;
  }

  /* ============ 气泡内的 Markdown 排版 ============ */
  .bubble p { margin: 7px 0; } .bubble p:first-child { margin-top: 0; } .bubble p:last-child { margin-bottom: 0; }
  .bubble ul, .bubble ol { margin: 7px 0; padding-left: 22px; }
  .bubble li { margin: 3px 0; }
  .bubble h1, .bubble h2, .bubble h3 { font-size: 15px; margin: 12px 0 6px; }
  .bubble table { border-collapse: separate; border-spacing: 0; margin: 10px 0; font-size: 13px; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .bubble th, .bubble td { padding: 8px 12px; text-align: left; white-space: nowrap; border-bottom: 1px solid var(--border); }
  .bubble tr:last-child td { border-bottom: none; }
  .bubble th { background: color-mix(in srgb, var(--accent1) 8%, var(--panel)); font-weight: 600; }
  .bubble tbody tr:nth-child(even) { background: color-mix(in srgb, var(--accent1) 3%, transparent); }
  .bubble code { background: color-mix(in srgb, var(--accent1) 10%, transparent); padding: 1px 6px; border-radius: 6px; font-size: 12.5px; }
  .bubble pre { background: color-mix(in srgb, var(--accent1) 7%, transparent); padding: 12px; border-radius: 10px; overflow-x: auto; margin: 8px 0; }
  .bubble pre code { background: none; padding: 0; }
  .bubble hr { border: none; border-top: 1px solid var(--border); margin: 10px 0; }

  /* "正在思考"动画 */
  /* 推荐素材会以 Markdown 图片的形式插进回复里 —— 不限宽的话
     4096px 的原图会把整个聊天布局撑爆 */
  .bubble img {
    max-width: 260px; width: 100%; height: auto; display: block;
    margin: 6px 0; border-radius: 10px; border: 1px solid var(--border);
    background: var(--bg);
  }
  /* 聊天里的图一律可点放大(见文件末尾「图片放大」)。加 cursor 和 hover
     是为了让人看出来"这能点" —— 表格里的缩略图只有 100px 上下,不给提示没人会去点 */
  .bubble img { cursor: zoom-in; transition: filter .12s, transform .12s; }
  .bubble img:hover { filter: brightness(1.06); transform: scale(1.02); }
  /* 表格里的缩略图给固定宽度。不给的话会被 .bubble img 的 width:100% 加上
     窄列挤成 40px 左右 —— 那么小根本看不出画面,而"看清竞品长什么样"正是重点。
     气泡本身有 overflow-x:auto,表格宽一点可以横向滚,不会撑破布局。 */
  .bubble td img { width: 120px; min-width: 120px; max-width: none; margin: 0; }

  /* 图片放大浮层 */
  .lightbox {
    position: fixed; inset: 0; z-index: 200; display: none;
    align-items: center; justify-content: center;
    background: rgba(15, 18, 24, .88); padding: 24px;
    -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
  }
  .lightbox.show { display: flex; }
  .lightbox img {
    max-width: min(1100px, 94vw); max-height: 86vh; width: auto; height: auto;
    border-radius: 12px; box-shadow: 0 18px 60px rgba(0,0,0,.5); background: #fff;
  }
  .lightbox-bar {
    position: absolute; left: 0; right: 0; bottom: 0;
    display: flex; gap: 12px; align-items: center; justify-content: center;
    flex-wrap: wrap; padding: 14px 20px 20px; color: #e8eaef; font-size: 13px;
  }
  .lightbox-bar a { color: #9ecbff; }
  .lightbox-close {
    position: absolute; top: 14px; right: 18px; width: 38px; height: 38px;
    border: 0; border-radius: 50%; cursor: pointer; font-size: 20px; line-height: 1;
    background: rgba(255,255,255,.14); color: #fff;
  }
  .lightbox-close:hover { background: rgba(255,255,255,.26); }
  .typing-note {
    margin-left: 8px; font-size: 12.5px; color: var(--muted);
    align-self: center; white-space: nowrap;
  }
  .typing-bubble { display: flex; gap: 5px; padding: 15px 18px; align-items: center; }
  .typing-bubble i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite; }
  .typing-bubble i:nth-child(2) { animation-delay: .2s; }
  .typing-bubble i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%,80%,100% { opacity: .25 } 40% { opacity: 1 } }

  /* 发送失败的消息:变淡 + 底下挂一条说明,避免"以为发出去了" */
  .row.undelivered { opacity: .55; flex-wrap: wrap; }
  .row.undelivered .bubble { filter: grayscale(.6); }
  .undelivered-tag {
    width: 100%; text-align: right; font-size: 11px; color: #dc2626;
    padding: 3px 42px 0 0; letter-spacing: .2px;
  }

  /* ============ 广告账户接入弹窗 ============ */
  #acct-btn.linked { color: var(--accent1); border-color: color-mix(in srgb, var(--accent1) 40%, transparent); }
  #acct-btn.unlinked { color: #d97706; border-color: color-mix(in srgb, #d97706 45%, transparent); }
  .overlay {
    position: fixed; inset: 0; z-index: 100; display: none;
    background: rgba(10, 12, 18, .45); backdrop-filter: blur(3px);
    align-items: center; justify-content: center; padding: 20px;
  }
  .overlay.show { display: flex; }
  .modal {
    background: var(--panel); border: 1px solid var(--border); border-radius: 18px;
    box-shadow: 0 20px 60px -12px rgba(0,0,0,.35);
    width: 100%; max-width: 520px; max-height: 86vh; overflow-y: auto;
    padding: 22px 24px; animation: rise .2s ease both;
  }
  .modal h2 { font-size: 16.5px; margin-bottom: 4px; }
  .modal .desc { font-size: 12.5px; color: var(--muted); line-height: 1.6; margin-bottom: 16px; }
  .modal label { display: block; font-size: 12.5px; font-weight: 600; margin: 14px 0 6px; }
  .modal input[type="text"], .modal input[type="password"] {
    width: 100%; padding: 10px 13px; font: inherit; font-size: 13.5px;
    border: 1.5px solid var(--border); border-radius: 11px;
    background: var(--bg); color: var(--text); outline: none;
  }
  .modal input:focus { border-color: var(--accent1); }
  .acct-status {
    display: flex; align-items: center; gap: 9px; padding: 11px 13px;
    border-radius: 11px; font-size: 13px; margin-bottom: 4px;
    background: color-mix(in srgb, var(--accent1) 7%, transparent);
    border: 1px solid color-mix(in srgb, var(--accent1) 20%, transparent);
  }
  .acct-status.bad { background: color-mix(in srgb, #d97706 9%, transparent); border-color: color-mix(in srgb, #d97706 30%, transparent); }
  .acct-list { display: flex; flex-direction: column; gap: 7px; margin-top: 6px; }
  .acct-item {
    display: flex; align-items: center; gap: 10px; cursor: pointer;
    padding: 10px 13px; border: 1.5px solid var(--border); border-radius: 11px;
    font-size: 13px; transition: all .13s ease; background: var(--bg);
  }
  .acct-item:hover { border-color: var(--accent1); }
  .acct-item.active { border-color: var(--accent1); background: color-mix(in srgb, var(--accent1) 9%, transparent); }
  .acct-item .aid { margin-left: auto; font-size: 11px; color: var(--muted); font-family: ui-monospace, monospace; }
  .modal-actions { display: flex; gap: 9px; justify-content: flex-end; margin-top: 20px; }
  .btn-primary {
    background: linear-gradient(135deg, var(--accent1), var(--accent2)); color: #fff;
    border: 0; border-radius: 11px; padding: 9px 20px; font-size: 13.5px; cursor: pointer;
  }
  .btn-primary:disabled { opacity: .5; cursor: not-allowed; }
  /* 竞品凭据弹窗:凭据串很长,用等宽字体的多行框,贴进去能看清有没有断 */
  .spy-label { display: block; font-size: 12.5px; font-weight: 600; margin: 14px 0 5px; color: #374151; }
  .spy-input {
    width: 100%; box-sizing: border-box; resize: vertical;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px;
    line-height: 1.5; padding: 9px 11px; border: 1px solid #d1d5db; border-radius: 9px;
    background: #f9fafb; color: #111827;
  }
  .spy-input:focus { outline: 2px solid var(--accent1); outline-offset: 1px; background: #fff; }
  .spy-status { font-size: 12.5px; padding: 9px 12px; border-radius: 9px; margin: 12px 0 4px; }
  .spy-status.ok   { background: #ecfdf5; color: #065f46; }
  .spy-status.warn { background: #fffbeb; color: #92400e; }
  .spy-howto { display: block; margin-top: 8px; color: #6b7280; font-size: 12px; line-height: 1.65; }
  .modal-msg { font-size: 12.5px; margin-top: 12px; line-height: 1.6; }
  .modal-msg.err { color: #dc2626; }
  .modal-msg.ok { color: #16a34a; }
  .modal a { color: var(--accent1); }

  /* 恢复历史后的分隔提示 */
  .restore-tip { text-align: center; font-size: 11.5px; color: var(--muted); padding: 4px 0; }

  /* ============ 快捷提问(开场展示) ============ */
  #chips { display: flex; flex-wrap: wrap; gap: 8px; padding-left: 42px; }
  .chip {
    background: var(--chip-bg); border: 1px solid var(--border); color: var(--text);
    border-radius: 999px; padding: 7px 14px; font-size: 13px; cursor: pointer;
    box-shadow: var(--shadow); transition: all .15s ease;
  }
  .chip:hover { border-color: var(--accent1); color: var(--accent1); transform: translateY(-1px); }

  /* ============ 输入区 ============ */
  footer { flex-shrink: 0; padding: 10px clamp(16px, 4vw, 40px) 18px; }
  .input-box {
    max-width: 920px; margin: 0 auto;
    display: flex; align-items: flex-end; gap: 8px;
    background: var(--panel); border: 1.5px solid var(--border); border-radius: 22px;
    padding: 8px 8px 8px 18px; box-shadow: var(--shadow);
    transition: border-color .15s ease;
  }
  .input-box:focus-within { border-color: var(--accent1); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent1) 12%, transparent); }
  textarea {
    flex: 1; resize: none; border: 0; outline: none; background: transparent; color: var(--text);
    font: inherit; font-size: 14.5px; line-height: 1.55; max-height: 140px; padding: 6px 0;
  }
  #send {
    width: 38px; height: 38px; border-radius: 50%; border: 0; cursor: pointer; flex-shrink: 0;
    background: linear-gradient(135deg, var(--accent1), var(--accent2)); color: #fff;
    display: grid; place-items: center; font-size: 16px;
    box-shadow: 0 4px 12px -2px color-mix(in srgb, var(--accent1) 50%, transparent);
    transition: transform .12s ease, opacity .15s ease;
  }
  #send:hover { transform: scale(1.06); }
  #send:disabled { opacity: .45; cursor: not-allowed; transform: none; }
  #attach {
    width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--border); cursor: pointer;
    background: transparent; font-size: 17px; flex-shrink: 0; display: grid; place-items: center;
    transition: all .15s ease;
  }
  #attach:hover { border-color: var(--accent1); background: color-mix(in srgb, var(--accent1) 8%, transparent); }
  #attach:disabled { opacity: .5; cursor: wait; }
  .hint { text-align: center; font-size: 11.5px; color: var(--muted); margin-top: 8px; }

  /* 细滚动条 */
  #messages::-webkit-scrollbar { width: 8px; }
  #messages::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--muted) 35%, transparent); border-radius: 8px; }
  #messages::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>
  <header>
    <button id="sidebar-toggle" class="ghost-btn" title="显示 / 隐藏对话列表">☰</button>
    <div class="logo">🤖</div>
    <div class="title-wrap">
      <h1 id="app-title">广告投放小助手</h1>
      <div class="sub"><span class="dot"></span><span id="app-sub">在线 · NewsBreak 对话式投放</span></div>
    </div>
    <div class="right">
      <span class="tagline" id="app-tagline">查数据 · 看报表 · 管投放</span>
      <button id="platform-btn" class="ghost-btn" title="切换投放平台" onclick="location.href='/platforms'">🔄</button>
      <span id="user-chip" class="ghost-btn" style="display:none;cursor:default"></span>
      <button id="dash-btn" class="ghost-btn" title="打开数据大屏(KPI/趋势/AI诊断)" onclick="location.href='/dashboard'">📊 大屏</button>
      <button id="acct-btn" class="ghost-btn" title="接入 / 切换广告账户">🔗 账户</button>
      <button id="spy-btn" class="ghost-btn" title="更新竞品查询凭据">🕵️</button>
      <button id="lang-toggle" class="ghost-btn" title="切换中文 / English">🌐 EN</button>
      <button id="new-chat" class="ghost-btn" title="开一个新对话(当前对话会存进左侧列表)">✚ 新对话</button>
    </div>
  </header>

  <!-- 广告账户接入弹窗 -->
  <div class="overlay" id="acct-overlay">
    <div class="modal">
      <h2 id="acct-title">🔗 接入广告账户</h2>
      <div class="desc" id="acct-desc"></div>
      <div id="acct-body"></div>
      <div class="modal-msg" id="acct-msg"></div>
      <div class="modal-actions">
        <button class="ghost-btn" id="acct-close">关闭</button>
      </div>
    </div>
  </div>

  <!-- 竞品查询凭据弹窗。凭据是浏览器登录态、会过期,所以要能随时贴一下就换掉,
       不用登服务器改配置文件、也不用重启 -->
  <div class="overlay" id="spy-overlay">
    <div class="modal">
      <h2 id="spy-title">🕵️ 竞品查询凭据</h2>
      <div class="desc" id="spy-desc"></div>
      <div id="spy-status"></div>
      <label class="spy-label" id="spy-auth-label"></label>
      <textarea id="spy-auth" class="spy-input" rows="2" spellcheck="false"></textarea>

  let lang = localStorage.getItem(LANG_KEY) === "en" ? "en" : "zh";
  const t = () => I18N[lang];

  /** 把界面上所有静态文案刷成当前语言 */
  function applyLang() {
    const d = t();
    document.documentElement.lang = lang === "en" ? "en" : "zh-CN";
    document.title = d.title;
    document.getElementById("app-title").textContent = d.title;
    document.getElementById("app-sub").textContent = d.sub.replace("{p}", PLATFORM_NAME);
    document.getElementById("app-tagline").textContent = d.tagline;
    document.getElementById("app-hint").textContent = d.hint;

    const langBtn = document.getElementById("lang-toggle");
    langBtn.textContent = d.langBtn;
    langBtn.title = d.langBtnTitle;

    const newChatBtn = document.getElementById("new-chat");
    newChatBtn.textContent = d.newChat;
    newChatBtn.title = d.newChatTitle;

    var dashBtn = document.getElementById("dash-btn");
    if (dashBtn) { dashBtn.textContent = d.dashBtn; dashBtn.title = d.dashBtnTitle; }

    // 账户按钮和弹窗也跟着换语言。
    // 必须用 acctReady 判断:账户模块在本文件末尾才初始化,而 applyLang 在那之前就会被调用一次;
    // 那时 renderAcctBtn 虽已"提升"可调用,但它依赖的 const 变量还没初始化,直接调会抛错、中断整个初始化。
    if (acctReady) {
      renderAcctBtn();
      if (document.getElementById("acct-overlay").classList.contains("show")) renderAcctModal();
    }
    // 竞品凭据弹窗同理,也要等它自己的模块初始化完才敢调

    document.getElementById("sidebar-head").textContent = d.sidebarHead;
    document.getElementById("sidebar-toggle").title = d.sidebarToggleTitle;
    if (typeof renderConvList === "function") renderConvList();
    document.getElementById("attach").title = d.attachTitle;

  // ===== 页面的"记忆":完整聊天记录。API 不记事,每次都把它全量发给后端 =====
  // 存在浏览器的 localStorage 里,刷新/关标签页都不会丢(换浏览器或清缓存才会没)
  var acctReady;   // 账户模块是否已初始化(见文件末尾「广告账户接入」)

  const STORE_KEY = "adbot-chat-history";        // 老版本的单条历史(用于一次性迁移)
  const CONVS_KEY = "adbot-conversations";       // 新版:所有会话
  const CUR_KEY = "adbot-current-conv";          // 当前打开的是哪个会话
  // 这份本地缓存属于哪个账号。同一台电脑换人登录时靠它认出"缓存不是我的"。
  const UID_KEY = "adbot-cache-uid";
  const MAX_KEEP = 200;    // 单个会话最多留 200 条
  const MAX_CONVS = 30;    // 左栏最多留 30 个会话,超了丢最旧的

  /** 读出所有会话。顺手把老版本的单条历史迁移成第一个会话,不丢用户数据。 */
  function loadConversations() {
    let convs = [];
    try {
      const raw = localStorage.getItem(CONVS_KEY);
      const arr = raw ? JSON.parse(raw) : [];
      if (Array.isArray(arr)) convs = arr.filter((c) => c && Array.isArray(c.messages));
    } catch (e) { /* 存档坏了就当没有,不能让页面开不出来 */ }

    if (convs.length === 0) {
      try {
        const old = JSON.parse(localStorage.getItem(STORE_KEY) || "[]");
        if (Array.isArray(old) && old.length > 0) {
          convs = [{ id: newId(), title: titleOf(old), messages: old, updatedAt: Date.now() }];
          migratedOld = true;   // 注意:这里**先不删**旧数据,等新数据确认存好了再删,
        }                       // 否则用户迁移后没发消息就刷新页面 → 历史永久丢失
      } catch (e) { /* 忽略 */ }
    }
    return convs;
  }

  let migratedOld = false;

  function newId() {
    return "c" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  }

  /** 会话标题:取第一句用户说的话,截断;没有就叫"新对话" */
  function titleOf(messages) {
    const first = messages.find((m) => m.role === "user");
    if (!first) return lang === "en" ? "New chat" : "新对话";
    const s = first.content.replace(/\s+/g, " ").trim();
    return s.length > 26 ? s.slice(0, 26) + "…" : s;
  }

  function saveConversations() {
    if (conversations.length > MAX_CONVS) conversations.length = MAX_CONVS;
    // 浏览器每个站点约 5MB 存储空间。攒久了会满 ——
    // 满了不能"悄悄存不进去"(用户会以为记录莫名其妙没了),
    // 要主动腾地方:从最旧的对话开始丢,并且明确告诉用户丢了几个。
    let dropped = 0;
    for (let attempt = 0; attempt < 12; attempt++) {
      try {
        localStorage.setItem(CONVS_KEY, JSON.stringify(conversations));
        localStorage.setItem(CUR_KEY, currentId);
        if (dropped) notifyStorageTrim(dropped);
        pushToServer();            // 登录了就同步到账号里(没登录是空操作)
        return true;
      } catch (e) {
        // 只有当前这个对话了还存不下 → 认输,但要如实告诉用户
        if (conversations.length <= 1) {
          console.warn("对话存盘失败:", e);
          notifyStorageFull();
          return false;
        }
        // 丢掉最旧的一个(数组按更新时间倒序,末尾最旧)
        conversations.pop();
        dropped++;
      }
    }
    return false;
  }

  /** 存储满时腾了地方 —— 必须让用户知道,不能默默丢数据 */
  function notifyStorageTrim(n) {
    if (document.getElementById("storage-tip")) return;   // 同一轮只提示一次
    const tip = document.createElement("div");
    tip.id = "storage-tip";
    tip.className = "restore-tip";
    tip.style.color = "#b54708";
    tip.textContent = t().storageTrimmed(n);
    messagesEl.appendChild(tip);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    setTimeout(() => tip.remove(), 15000);
  }

  function notifyStorageFull() {
    if (document.getElementById("storage-full")) return;
    const tip = document.createElement("div");
    tip.id = "storage-full";
    tip.className = "restore-tip";
    tip.style.color = "#b42318";
    tip.textContent = t().storageFull;
    messagesEl.appendChild(tip);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  /** 把当前 history 写回它所属的会话(每收发一条消息都会调) */
  function saveHistory() {
    if (history.length > MAX_KEEP) history.splice(0, history.length - MAX_KEEP);
    let conv = conversations.find((c) => c.id === currentId);
    if (!conv) {
      if (history.length === 0) { saveConversations(); return; }   // 空的新对话先不落盘
      conv = { id: currentId, title: "", messages: [], updatedAt: 0 };
      conversations.unshift(conv);       // 新会话排最前
    }
    conv.messages = history.slice();
    conv.title = titleOf(history);
    conv.updatedAt = Date.now();
    saveConversations();
    renderConvList();
  }

  // 缓存里存过 uid,说明这台电脑登录过账号 —— 但现在还不知道**这次**是谁登录的
  // (要等 /api/me 回来)。在确认之前先不把旧记录摆出来,否则换个人登录会
  // 一闪而过地看到上一个人的会话标题。
  const cacheOwned = !!localStorage.getItem(UID_KEY);
  const conversations = cacheOwned ? [] : loadConversations();
  const cachedConvs = cacheOwned ? loadConversations() : null;   // 确认是本人后再用
  let currentId = cacheOwned ? "" : (localStorage.getItem(CUR_KEY) || "");
  if (!conversations.some((c) => c.id === currentId)) {
    currentId = conversations[0] ? conversations[0].id : newId();
  }
  const cur = conversations.find((c) => c.id === currentId);
  const history = cur ? cur.messages.slice() : [];

  // 从老版本迁移过来的:立刻落盘,确认写成功后才删掉旧数据(顺序反了会丢历史)
  if (migratedOld) {
    saveConversations();
    if (localStorage.getItem(CONVS_KEY)) localStorage.removeItem(STORE_KEY);
  }

  const messagesEl = document.getElementById("messages");
  const inputEl = document.getElementById("input");
  const sendBtn = document.getElementById("send");

  // 防止内容里混入 HTML 标签捣乱(只放行无害的 <br> 换行标签)
  function escapeHtml(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
            .replace(/&lt;br\s*\/?&gt;/gi, "<br>");
  }

  // 画一行消息(头像 + 气泡)。who 是 "user" / "bot" / "error"
  function addBubble(who, text) {
    const row = document.createElement("div");
    row.className = "row " + (who === "user" ? "user" : who === "error" ? "error" : "bot");

    const avatar = document.createElement("div");
    avatar.className = "avatar " + (who === "user" ? "user" : "bot");
    avatar.textContent = who === "user" ? "我" : "🤖";

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    if (who === "bot") {
      bubble.dataset.raw = text;      // 存原文,marked 晚到时可以重新排版
      renderBubble(bubble, text);
    } else {
      bubble.textContent = text;
    }

    row.appendChild(avatar);
    row.appendChild(bubble);
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return row;
  }

  /** 把一段文字画进气泡:排版库到了就按 Markdown 排,没到就先按纯文本显示 */
  function renderBubble(bubble, text) {
    if (window.marked) {
      bubble.innerHTML = marked.parse(escapeHtml(text), { breaks: true });
    } else {
      bubble.textContent = text;
    }
  }

  // 排版库(marked.js)异步加载完成后回调:把之前按纯文本显示的气泡补排一次版。
  // 这样即使它慢到、甚至加载失败,页面也照样可用,只是表格样式差一点。
  window.onMarkedReady = function () {
    document.querySelectorAll(".row.bot .bubble[data-raw]").forEach((b) => {
      renderBubble(b, b.dataset.raw);
    });
  };

  // 给发送失败的那条消息打上"未送达"标记。
  // 为什么需要:失败时我们会把这句从记忆里撤掉(方便重发),
  // 但气泡还留在屏幕上——不标出来的话,你会以为助手听见了,其实它完全不知道。
  function markUndelivered(row) {
    if (!row) return;
    row.classList.add("undelivered");
    const tag = document.createElement("div");
    tag.className = "undelivered-tag";
    tag.textContent = t().undelivered;
    row.appendChild(tag);
  }

  // "正在思考"的三个小点
  function showTyping() {
    const row = document.createElement("div");
    row.className = "row bot";
    const avatar = document.createElement("div");
    avatar.className = "avatar bot";
    avatar.textContent = "🤖";
    const bubble = document.createElement("div");
    bubble.className = "bubble typing-bubble";
    bubble.innerHTML = "<i></i><i></i><i></i>";
    // 进度文字用真节点建(不写进 innerHTML 字符串):这样才查得到、改得动
    const note = document.createElement("span");
    note.className = "typing-note";
    bubble.appendChild(note);
    row.appendChild(avatar);
    row.appendChild(bubble);
    row._note = note;          // 直接挂上,免得每次都去 querySelector
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return row;
  }

  /** 把「正在查报表…」这类进度写到打字气泡上,让用户知道它在干活而不是卡死 */
  function setTypingNote(row, text) {
    if (!row) return;
    const note = row._note || (row.querySelector && row.querySelector(".typing-note"));
    if (note) note.textContent = text || "";
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  /** 流式过程中,先用一个「纯文本」气泡承接不断到来的字。
   *  为什么不边收边渲染 Markdown:表格写到一半是断的,渲染出来一片乱码,
   *  看着像出错了。所以过程中显示纯文本,收尾时再整体排版一次。 */
  function startStreamBubble() {
    const row = addBubble("bot", "");
    const bubble = row.children[1] || row.lastElementChild;
    return {
      row: row,
      append: function (piece) {
        bubble.textContent = (bubble.textContent || "") + piece;
        messagesEl.scrollTop = messagesEl.scrollHeight;
      },
      clear: function () { bubble.textContent = ""; },
      isEmpty: function () { return !(bubble.textContent || "").trim(); },
      remove: function () { row.remove(); },
    };
  }

  /** 后端明确说明了原因的错误(区别于网络故障)。用 function 声明,会被提升。 */
  function ChatError(message) {
    const e = new Error(String(message));
    e.name = "ChatError";
    return e;
  }

  /** 一轮问答收尾:用排好版的最终文本建气泡、记进历史、存盘。
   *  流式过程中显示的是纯文本,这里才做 Markdown 排版(表格要完整才排得对),
   *  而且 done 事件带的是**盖过钢印的**回复,和非流式接口完全一致。 */
  function finishReply(reply) {
    addBubble("bot", reply);
    history.push({ role: "assistant", content: reply });
    saveHistory();
  }

  let busy = false;   // 正在等回复时为 true,挡住重复发送

  async function send(presetText) {
    // 上一条还没回来就别再发了——否则会同时发两个请求:
    // 两份回复、两次消耗额度,而且第二个带的还是旧上下文
    if (busy) {
      inputEl.placeholder = t().busy;
      setTimeout(() => { inputEl.placeholder = t().placeholder; }, 1800);
      return;
    }

    const text = (presetText || inputEl.value).trim();
    if (!text) return;

    const chips = document.getElementById("chips");
    if (chips) chips.remove();   // 开始聊天后,收起快捷提问

    inputEl.value = "";
    inputEl.style.height = "auto";
    const userRow = addBubble("user", text);   // 记住这一行,失败时要给它加标记
    history.push({ role: "user", content: text });
    saveHistory();

    busy = true;
    sendBtn.disabled = true;
    const typing = showTyping();

    // 超时保护:后端卡死时不要让小点一直转下去
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 180000);   // 3 分钟

    let stream = null;   // 承接流式文字的气泡(只有真出字了才建)
    try {
      const body = JSON.stringify({ messages: history, lang: lang });
      const common = {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: body,
        signal: controller.signal,
      };

      let res = await fetch("/api/chat/stream", common);

      // 流式接口不可用(旧版后端 404、或被中间的代理拦了)→ 退回一次性接口。
      // 宁可慢一点全须全尾地回来,也不能让用户对着空白页面干等。
      if (!res.ok && (res.status === 404 || res.status === 405)) {
        res = await fetch("/api/chat", common);
        const data = await res.json();
        typing.remove();
        if (!res.ok) throw new ChatError(data.error || res.status);
        finishReply(data.reply);
        return;
      }

      const ctype = res.headers.get("content-type") || "";
      if (!ctype.includes("text/event-stream")) {
        // 后端直接回了 JSON(多半是出错了)
        const data = await res.json().catch(() => ({}));
        typing.remove();
        throw new ChatError(data.error || ("HTTP " + res.status));
      }

      // ===== 逐块读 SSE =====
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buf = "", finalReply = null, failed = null;

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });

        // SSE 以空行分隔一条事件;最后可能是半条,留在缓冲里等下一块
        const chunks = buf.split("\n\n");
        buf = chunks.pop();
        for (const chunk of chunks) {
          const line = chunk.split("\n").find((l) => l.indexOf("data: ") === 0);
          if (!line) continue;
          let ev;
          try { ev = JSON.parse(line.slice(6)); } catch (e) { continue; }

          if (ev.type === "status") {
            setTypingNote(typing, ev.text);
          } else if (ev.type === "delta") {
            if (!stream) stream = startStreamBubble();
            stream.append(ev.text || "");
          } else if (ev.type === "reset") {
            // 模型先说了句开场白又跑去调工具了 —— 那段不是答案,作废
            if (stream) { stream.remove(); stream = null; }
          } else if (ev.type === "done") {
            finalReply = ev.reply;
          } else if (ev.type === "error") {
            failed = ev.error;
          }
        }
      }

      typing.remove();
      if (stream) { stream.remove(); stream = null; }   // 换成排好版的最终气泡
      if (failed) throw new ChatError(failed);
      if (finalReply === null) throw new ChatError(t().streamBroken);
      finishReply(finalReply);
    } catch (err) {
      if (stream) stream.remove();
      typing.remove();
      // ChatError = 后端明确告诉我们的原因(钥匙不对、额度用完…),原样转给用户;
      // 其它异常才是"网络问题",别把后端的真实原因盖成"连不上"
      const msg = err.name === "AbortError" ? t().timeout
                : err.name === "ChatError" ? t().errPrefix + err.message
                : t().netErr + err.message;
      addBubble("error", msg);
      history.pop();          // 这轮没成功,撤掉刚才那句,方便重发
      markUndelivered(userRow);
      saveHistory();
    } finally {
      clearTimeout(timer);
      busy = false;
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  // 回车发送,Shift+回车换行;输入法组字中的回车(isComposing/229)一律放行
  inputEl.addEventListener("keydown", (e) => {
    if (e.isComposing || e.keyCode === 229) return;
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  });
  inputEl.addEventListener("input", () => {
    inputEl.style.height = "auto";
    inputEl.style.height = inputEl.scrollHeight + "px";
  });
  sendBtn.addEventListener("click", () => send());

  // ===== 素材上传(📎按钮 和 直接粘贴图片 共用这一套) =====
  const attachBtn = document.getElementById("attach");
  const fileInput = document.getElementById("file-input");

  function prettySize(bytes) {
    if (bytes >= 1048576) return (bytes / 1048576).toFixed(1) + " MB";
    if (bytes >= 1024) return Math.round(bytes / 1024) + " KB";
    return bytes + " B";
  }

  async function uploadFile(f) {
    if (!f) return;
    const d = t();
    const info = `${f.name || "(未命名)"} · ${prettySize(f.size || 0)}`;

    // 上传前先自查,能在本地拦下的就别白跑一趟
    if (!f.size) { addBubble("error", d.uploadFail + d.upErrEmpty); return; }
    if (f.size > 100 * 1024 * 1024) {
      addBubble("error", d.uploadFail + d.upErrTooBig(prettySize(f.size)));
      return;
    }
    const kind = (f.type || "").split("/")[0];
    if (f.type && kind !== "image" && kind !== "video") {
      addBubble("error", d.uploadFail + d.upErrWrongType(f.type));
      return;
    }

    attachBtn.disabled = true;
    attachBtn.textContent = "⏳";
    const tip = addBubble("bot", d.upUploading(info));   // 让用户知道正在传、传的是什么

    const form = new FormData();
    form.append("file", f, f.name || "pasted-image.png");

    // 大文件也别无限等:3 分钟没结果就主动放弃并说清楚
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 180000);

    try {
      const res = await fetch("/api/upload", { method: "POST", body: form, signal: ctrl.signal });
      let data = {};
      try { data = await res.json(); } catch (e) { /* 返回的不是 JSON,下面按状态码兜底 */ }
      tip.remove();
      if (!res.ok) {
        // 服务器有话说就照实转达(NewsBreak 的真实原因都在这儿),没话说才用状态码兜底
        const reason = data.error || d.upErrHttp(res.status);
        addBubble("error", `${d.uploadFail}${reason}\n📄 ${info}`);
      } else if (!data.asset_url) {
        addBubble("error", `${d.uploadFail}${d.upErrNoUrl}\n📄 ${info}`);
      } else {
        send(d.uploadedMsg(data.filename, data.asset_url));
      }
    } catch (err) {
      tip.remove();
      // 走到这里是「网络层就失败了」——服务器没给出任何原因,只能解释可能性
      const reason = err.name === "AbortError" ? d.upErrTimeout : d.upErrNetwork(err.message || err.name);
      addBubble("error", `${d.uploadFail}${reason}\n📄 ${info}`);
    } finally {
      clearTimeout(timer);
      attachBtn.disabled = false;
      attachBtn.textContent = "📎";
      fileInput.value = "";
    }
  }

  attachBtn.addEventListener("click", () => fileInput.click());
  fileInput.addEventListener("change", () => uploadFile(fileInput.files[0]));

  // 在输入框里 Ctrl+V / Cmd+V 直接粘贴截图或复制的图片,自动上传
  inputEl.addEventListener("paste", (e) => {
    const items = e.clipboardData ? e.clipboardData.items : [];
    for (const item of items) {
      if (item.type && item.type.startsWith("image/")) {
        e.preventDefault();
        const f = item.getAsFile();
        // 粘贴的图片没有文件名,按它的真实类型起名(别一律叫 .png,
        // 否则 GIF 会被当成普通图片提交给平台)
        const ext = (f.type.split("/")[1] || "png").replace("jpeg", "jpg");
        const named = new File([f], `paste-${Date.now()}.${ext}`, { type: f.type });
        uploadFile(named);
        return;
      }
    }
  });

  // ===== 开场:有存档就恢复,没有才显示欢迎语 + 快捷提问 =====
  function showWelcome() {
    const row = addBubble("bot", t().welcome);
    row.dataset.welcome = "1";   // 打标记:切语言时这条要跟着换(它是界面文字,不是对话内容)

    const chipsWrap = document.createElement("div");
    chipsWrap.id = "chips";
    t().chips.forEach((q) => {
      const b = document.createElement("button");
      b.className = "chip";
      b.textContent = q;
      b.onclick = () => send(q);
      chipsWrap.appendChild(b);
    });
    messagesEl.appendChild(chipsWrap);
  }

  function restoreHistory() {
    history.forEach((m) => addBubble(m.role === "user" ? "user" : "bot", m.content));
    const tip = document.createElement("div");
    tip.className = "restore-tip";
    tip.textContent = t().restoreTip(history.length);
    messagesEl.appendChild(tip);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  // ===== 左侧会话栏 =====
  const convListEl = document.getElementById("conv-list");

  /** 重画左栏列表 */
  function renderConvList() {
    convListEl.innerHTML = "";
    if (conversations.length === 0) {
      const empty = document.createElement("div");
      empty.className = "conv-empty";
      empty.textContent = t().noConvs;
      convListEl.appendChild(empty);
      return;
    }
    conversations.forEach((c) => {
      const item = document.createElement("div");
      item.className = "conv-item" + (c.id === currentId ? " active" : "");
      item.title = c.title;

      const title = document.createElement("div");
      title.className = "conv-title";
      title.textContent = c.title || t().untitled;
      item.appendChild(title);

      const del = document.createElement("button");
      del.className = "conv-del";
      del.textContent = "×";
      del.title = t().deleteConv;
      del.addEventListener("click", (e) => {
        e.stopPropagation();          // 别触发"切换到这个会话"
        deleteConversation(c.id);
      });
      item.appendChild(del);

      item.addEventListener("click", () => switchConversation(c.id));
      convListEl.appendChild(item);
    });
  }

  /** 把屏幕上的消息重画成某个会话的内容 */
  function paintCurrent() {
    messagesEl.innerHTML = "";
    if (history.length > 0) restoreHistory();
    else showWelcome();
  }

  function switchConversation(id) {
    if (id === currentId || busy) return;    // 正在等回复时先别切,免得回复落到别的会话里
    const conv = conversations.find((c) => c.id === id);
    if (!conv) return;
    currentId = id;
    history.length = 0;
    conv.messages.forEach((m) => history.push(m));
    localStorage.setItem(CUR_KEY, currentId);
    paintCurrent();
    renderConvList();
    inputEl.focus();
  }

  function deleteConversation(id) {
    if (!confirm(t().confirmDelete)) return;
    const idx = conversations.findIndex((c) => c.id === id);
    if (idx === -1) return;
    conversations.splice(idx, 1);

    if (id === currentId) {
      // 删的是当前打开的:切到下一个,没有了就开个空的
      const next = conversations[0];
      currentId = next ? next.id : newId();
      history.length = 0;
      if (next) next.messages.forEach((m) => history.push(m));
      paintCurrent();
    }
    saveConversations();
    renderConvList();
  }

  /** 开新对话:当前这段已经在 conversations 里了,只要新开一个空的即可(不删任何东西) */
  function startNewConversation() {
    if (history.length === 0) return;    // 已经是空白新对话了,别重复开
    currentId = newId();
    history.length = 0;
    localStorage.setItem(CUR_KEY, currentId);
    paintCurrent();
    renderConvList();
    inputEl.focus();
  }

  applyLang();                       // 先把界面刷成当前语言
  paintCurrent();
  renderConvList();

  document.getElementById("new-chat").addEventListener("click", startNewConversation);

  document.getElementById("sidebar-toggle").addEventListener("click", () => {
    document.getElementById("sidebar").classList.toggle("collapsed");
  });

  // 🌐 中英文切换:界面文案立刻换;已有的对话内容保持原样(那是历史记录,
  // 不该改写),新的回复会用新语言 —— 后端会收到 lang 并切换 AI 的语言。
  document.getElementById("lang-toggle").addEventListener("click", () => {
    const wasBusy = busy;   // 切换瞬间是否还有回复在路上?那条回复用的是旧语言
    lang = lang === "zh" ? "en" : "zh";
    localStorage.setItem(LANG_KEY, lang);
    applyLang();

    // 开场页(还没聊过)整个重画,让欢迎语和快捷提问都换语言
    if (history.length === 0) {
      messagesEl.innerHTML = "";
      showWelcome();
      inputEl.focus();
      return;
    }

    // 已经聊过:对话内容保持原样(那是历史记录),但开场欢迎语属于界面文字,跟着换
    const welcomeRow = messagesEl.querySelector('.row[data-welcome="1"] .bubble');
    if (welcomeRow) {
      welcomeRow.dataset.raw = t().welcome;
      renderBubble(welcomeRow, t().welcome);
    }

    // 提示语:同一条反复切换时替换掉旧提示,不要堆一串
    let tip = messagesEl.lastElementChild;
    if (!tip || !tip.classList.contains("switch-tip")) {
      tip = document.createElement("div");
      tip.className = "restore-tip switch-tip";
      messagesEl.appendChild(tip);
    }
    tip.textContent = lang === "en"
      ? "— Switched to English. New replies will be in English —"
      : "— 已切换为中文,接下来的回复会用中文 —";

    // 关键提醒:切换前发出的那条请求,回来时仍是旧语言(不是切换失效)
    if (wasBusy) {
      const warn = document.createElement("div");
      warn.className = "restore-tip switch-tip";
      warn.textContent = lang === "en"
        ? "(The reply already on its way was requested in Chinese, so it will arrive in Chinese.)"
        : "(切换前发出的那条请求仍会用英文回复,这是正常的,不是切换没生效。)";
      messagesEl.appendChild(warn);
    }
    messagesEl.scrollTop = messagesEl.scrollHeight;
    inputEl.focus();
  });

  // ===== 🔗 广告账户接入 =====
  // 注意:acctReady 用 var 声明(var 会提升并初始化为 undefined),
  // 这样 applyLang() 在本模块初始化之前读它是安全的。
  acctReady = false;
  const acctBtn = document.getElementById("acct-btn");
  const acctOverlay = document.getElementById("acct-overlay");
  const acctBody = document.getElementById("acct-body");
  const acctMsg = document.getElementById("acct-msg");
  let acctState = null;          // 最近一次从后端拿到的接入状态
  let showTokenForm = false;     // 是否正在显示"填 Token"表单

  function setAcctMsg(text, kind) {
    acctMsg.textContent = text || "";
    acctMsg.className = "modal-msg" + (kind ? " " + kind : "");
  }

  // 顶栏按钮:接入了显示账户名,没接入显示醒目的橙色提示
  function renderAcctBtn() {
    const d = t();
    if (acctState && acctState.connected) {
      const active = (acctState.accounts || []).find((a) => a.id === acctState.active_account_id);
      const name = active ? active.name : d.acctBtn;
      acctBtn.textContent = "🔗 " + (name.length > 12 ? name.slice(0, 12) + "…" : name);
      acctBtn.className = "ghost-btn linked";
    } else {
      acctBtn.textContent = d.acctBtnUnlinked;
      acctBtn.className = "ghost-btn unlinked";
    }
    acctBtn.title = d.acctBtnTitle;
  }

  // 弹窗内容:根据"接没接入"渲染两种界面
  function renderAcctModal() {
    const d = t();
    document.getElementById("acct-title").textContent = d.acctTitle;
    document.getElementById("acct-close").textContent = d.acctClose;
    const linked = acctState && acctState.connected;
    document.getElementById("acct-desc").textContent = linked ? d.acctDescLinked : d.acctDescUnlinked;
    acctBody.innerHTML = "";

    // ① 没接入(或点了"更换 Token"):显示填写表单
    if (!linked || showTokenForm) {
      if (acctState && acctState.error) {
        const bad = document.createElement("div");
        bad.className = "acct-status bad";
        bad.textContent = "⚠️ " + d.acctTokenBad;
        acctBody.appendChild(bad);
      }
      const label = document.createElement("label");
      label.textContent = d.acctTokenLabel;
      const input = document.createElement("input");
      input.type = "password";
      input.id = "acct-token-input";
      input.placeholder = d.acctTokenPlaceholder;
      const help = document.createElement("div");
      help.className = "desc";
      help.style.marginTop = "8px";
      help.textContent = d.acctTokenHelp;
      const save = document.createElement("button");
      save.className = "btn-primary";
      save.style.marginTop = "14px";
      save.textContent = d.acctSave;
      save.onclick = async () => {
        const token = input.value.trim();
        if (!token) return;
        save.disabled = true;
        save.textContent = d.acctSaving;
        setAcctMsg("");
        try {
          const res = await fetch("/api/account/token", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ token }),
          });
          const data = await res.json();
          if (!res.ok) {
            setAcctMsg(data.error || "保存失败", "err");
          } else {
            acctState = data;
            showTokenForm = false;
            setAcctMsg(d.acctSaved, "ok");
            renderAcctBtn();
            renderAcctModal();
            refreshPlatformBinding();   // 绑上了就把聊天界面解锁,不用用户手动刷新
            return;
          }
        } catch (e) {
          setAcctMsg(String(e), "err");
        }
        save.disabled = false;
        save.textContent = d.acctSave;
      };
      acctBody.appendChild(label);
      acctBody.appendChild(input);
      acctBody.appendChild(help);
      acctBody.appendChild(save);
      setTimeout(() => input.focus(), 50);
      return;
    }

    // ② 已接入:显示组织 + 账户列表(可点击切换)
    const org = (acctState.organizations || [])[0];
    const status = document.createElement("div");
    status.className = "acct-status";
    status.textContent = `✅ ${d.acctConnected} · ${d.acctOrgLabel}:${org ? org.name : "-"}`;
    acctBody.appendChild(status);

    const label = document.createElement("label");
    label.textContent = d.acctPickLabel;
    acctBody.appendChild(label);

    const list = document.createElement("div");
    list.className = "acct-list";
    (acctState.accounts || []).forEach((a) => {
      const item = document.createElement("div");
      item.className = "acct-item" + (a.id === acctState.active_account_id ? " active" : "");
      const dot = document.createElement("span");
      dot.textContent = a.id === acctState.active_account_id ? "🟢" : "⚪️";
      const name = document.createElement("span");
      name.textContent = a.name;
      const aid = document.createElement("span");
      aid.className = "aid";
      aid.textContent = a.id;
      item.append(dot, name, aid);
      item.onclick = async () => {
        if (a.id === acctState.active_account_id) return;
        setAcctMsg("");
        try {
          const res = await fetch("/api/account/select", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ account_id: a.id }),
          });
          const data = await res.json();
          if (!res.ok) { setAcctMsg(data.error || "切换失败", "err"); return; }
          acctState = data;
          setAcctMsg(d.acctSwitched, "ok");
          renderAcctBtn();
          renderAcctModal();
        } catch (e) {
          setAcctMsg(String(e), "err");
        }
      };
      list.appendChild(item);
    });
    acctBody.appendChild(list);

    const change = document.createElement("button");
    change.className = "ghost-btn";
    change.style.marginTop = "16px";
    change.textContent = d.acctChange + "(" + acctState.token_masked + ")";
    change.onclick = () => { showTokenForm = true; setAcctMsg(""); renderAcctModal(); };
    acctBody.appendChild(change);
  }

  async function refreshAcct() {
    try {
      const res = await fetch("/api/account");
      acctState = await res.json();
    } catch (e) {
      acctState = { connected: false };
    }
    renderAcctBtn();
  }

  acctBtn.addEventListener("click", () => {
    showTokenForm = false;
    setAcctMsg("");
    renderAcctModal();
    acctOverlay.classList.add("show");
    refreshAcct().then(renderAcctModal);   // 打开时顺便刷新一次最新状态
  });
  document.getElementById("acct-close").addEventListener("click", () => acctOverlay.classList.remove("show"));
  acctOverlay.addEventListener("click", (e) => { if (e.target === acctOverlay) acctOverlay.classList.remove("show"); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") acctOverlay.classList.remove("show"); });

  acctReady = true;   // 到这里账户模块的变量和函数才真正可用
  refreshAcct();      // 页面打开时先查一次,顶栏按钮立刻显示当前账户

  // ===== 账号同步:登录后聊天记录存在服务器上,跟着账号走 =====
  var serverUser = "";       // 当前登录的用户名(空=没启用登录/没登录)
  var pushTimer = null;

  /** 把本地记录推到服务器(攒 1 秒再发,避免每敲一句就请求一次) */
  function pushToServer() {
    if (!serverUser) return;
    clearTimeout(pushTimer);
    pushTimer = setTimeout(function () {
      fetch("/api/chats", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ conversations: conversations }),
      }).catch(function (e) { console.warn("同步到账号失败:", e); });
    }, 1000);
  }

  /** 开机时和服务器对一次账:服务器有就用服务器的,服务器空就把本地的传上去 */
  function syncFromServer() {
    fetch("/api/me")
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d.username) return;                     // 没启用登录 → 保持纯本地模式
        serverUser = d.username;
        renderUserChip();

        // 本地缓存是不是这个人的?同一台电脑换账号登录时,
        // 缓存里躺着的是**上一个人**的记录 —— 既不能显示给他看,
        // 更不能当成"他的未同步记录"上传到他账号里(那是跨账号泄露)。
        var uid = d.id || d.username;
        var cachedUid = localStorage.getItem(UID_KEY) || "";
        if (cachedUid && cachedUid !== uid) {
          conversations.length = 0;
          currentId = "";
          history.length = 0;
          try {
            localStorage.removeItem(CONVS_KEY);
            localStorage.removeItem(CUR_KEY);
          } catch (e) { /* 清不掉也不影响:下面以服务器为准 */ }
          messagesEl.innerHTML = "";
          showWelcome();
          renderConvList();
        }
        else if (cachedConvs && cachedConvs.length && !conversations.length) {
          // 确认就是本人 → 把刚才按住没显示的缓存放回去(服务器要是挂了还能看历史)
          Array.prototype.push.apply(conversations, cachedConvs);
          currentId = localStorage.getItem(CUR_KEY) || (conversations[0] || {}).id || "";
        }
        try { localStorage.setItem(UID_KEY, uid); } catch (e) {}
        return fetch("/api/chats").then(function (r) { return r.json(); }).then(function (data) {
          var remote = (data && data.conversations) || [];
          if (remote.length > 0) {
            // 服务器上有 → 以服务器为准(这样换电脑登录也能看到)
            conversations = remote;
            currentId = (conversations[0] && conversations[0].id) || "";
            history.length = 0;
            var cur = conversations.find(function (c) { return c.id === currentId; });
            if (cur) Array.prototype.push.apply(history, cur.messages || []);
            try {
              localStorage.setItem(CONVS_KEY, JSON.stringify(conversations));
              localStorage.setItem(CUR_KEY, currentId);
            } catch (e) { /* 本地缓存存不下不影响主流程 */ }
            messagesEl.innerHTML = "";
            if (history.length) restoreHistory(); else showWelcome();
            renderConvList();
          } else if (conversations.length > 0) {
            // 服务器还空着,但本地有 → 把本地的传上去,不丢老记录
            pushToServer();
          }
        });
      })
      .catch(function (e) { console.warn("读取账号信息失败:", e); });
  }

  function renderUserChip() {
    var chip = document.getElementById("user-chip");
    if (!chip || !serverUser) return;
    chip.style.display = "";
    chip.textContent = "👤 " + serverUser;
    chip.title = "点击退出登录";
    chip.style.cursor = "pointer";
    chip.onclick = function () {
      if (!confirm("确定退出登录吗?(记录已存在账号里,下次登录还能看到)")) return;
      fetch("/api/logout", { method: "POST" }).finally(function () { location.href = "/login"; });
    };
  }

  // ===== 平台信息:更新副标题;没绑账号就明确挡一道 =====
  function loadPlatform() {
    fetch("/api/platforms")
      .then(function (r) { return r.json(); })
      .then(function (data) {
        var p = (data.platforms || []).find(function (x) { return x.id === PLATFORM; });
        if (!p) return;
        PLATFORM_NAME = p.name;
        PLATFORM_BOUND = !!p.bound;
        applyLang();                       // 副标题里的 {p} 换成真实平台名
        document.getElementById("platform-btn").title = t().switchPlatform;
        if (!PLATFORM_BOUND || WANT_BIND) showNotBound(p);
      })
      .catch(function (e) { console.warn("读取平台信息失败:", e); });
  }

  /** 没绑定账号:在聊天区顶部贴一条醒目提示,并把输入框停用 */
  function showNotBound(p) {
    var d = t();
    var row = document.createElement("div");
    row.className = "row bot";
    row.id = "not-bound";
    var body = d.notBoundBody.replace(/\{p\}/g, p.name);
    var hint = lang === "en" ? p.bind_hint_en : p.bind_hint_zh;
    row.innerHTML =
      '<div class="avatar bot">🔗</div>' +
      '<div class="bubble" style="border-color:#d97706">' +
        '<strong>⚠️ ' + escapeHtml(d.notBoundTitle.replace(/\{p\}/g, p.name)) + '</strong>' +
        '<p>' + escapeHtml(body) + '</p>' +
        (hint ? '<p style="font-size:12.5px;opacity:.8">' + escapeHtml(hint) + '</p>' : '') +
        '<button class="ghost-btn" id="go-bind" style="margin-top:6px">' + escapeHtml(d.notBoundBtn) + '</button>' +
      '</div>';
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    var btn = document.getElementById("go-bind");
    if (btn) btn.onclick = function () { document.getElementById("acct-btn").click(); };
    // 没绑定就别让用户白打字
    inputEl.disabled = true;
    inputEl.placeholder = d.notBoundTitle.replace(/\{p\}/g, p.name);
    sendBtn.disabled = true;
  }

  /** 存完 token 后回头问一次后端:这个平台现在算绑定了吗?算就把界面放开。
   *  特意不"存成功就直接放开"——以后端的 bound() 为准,才不会界面和实际不一致。*/
  function refreshPlatformBinding() {
    fetch("/api/platforms")
      .then(function (r) { return r.json(); })
      .then(function (data) {
        var p = (data.platforms || []).find(function (x) { return x.id === PLATFORM; });
        if (p && p.bound) clearNotBound(p);
      })
      .catch(function (e) { console.warn("回查平台绑定状态失败:", e); });
  }

  /** 撤掉 ⚠️ 提示、解锁输入框,并在聊天区说一句,让用户立刻知道成了 */
  function clearNotBound(p) {
    if (PLATFORM_BOUND) return;          // 本来就没锁,不用重复说
    PLATFORM_BOUND = true;
    var row = document.getElementById("not-bound");
    if (row && row.remove) row.remove();
    inputEl.disabled = false;
    sendBtn.disabled = false;
    inputEl.placeholder = t().placeholder;
    addBubble("bot", t().boundOk.replace(/\{p\}/g, (p && p.name) || PLATFORM_NAME));
    inputEl.focus();
  }

  loadPlatform();
  // ===== 竞品查询凭据 =====
  // 这份凭据是从浏览器复制的登录态、**会过期**,所以必须能随手换掉 ——
  // 原来要 SSH 上服务器改配置文件再重启,太重了,重到人宁可不换。
  // 注意:这个模块在文件末尾,里面的 const 不会提升,所以 applyLang 要靠
  // spyReady 标志判断能不能调 renderSpyModal(见上面「点按钮没反应」那条教训)。
  spyReady = false;
  const spyBtn = document.getElementById("spy-btn");
  const spyOverlay = document.getElementById("spy-overlay");
  const spyMsgEl = document.getElementById("spy-msg");
  let spyState = null;      // 后端回来的凭据现状

  function renderSpyModal() {
    const d = I18N[lang];
    spyBtn.title = d.spyBtnTitle;
    document.getElementById("spy-title").textContent = d.spyTitle;
    document.getElementById("spy-desc").innerHTML =
      escapeHtml(d.spyDesc).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
      + '<br><span class="spy-howto">' + escapeHtml(d.spyHowto) + "</span>";
    document.getElementById("spy-auth-label").textContent = d.spyAuthLabel;
    document.getElementById("spy-save").textContent = d.spySave;
    document.getElementById("spy-close").textContent = d.spyClose;

    let txt = d.spyStatusNone;
    if (spyState && spyState.masked) {
      txt = d.spyStatusMine.replace("{m}", spyState.masked)
                           .replace("{t}", spyState.updated_at || "-");
    } else if (spyState && spyState.configured) {
      txt = d.spyStatusShared;
    }
    const st = document.getElementById("spy-status");
    st.textContent = txt;
    st.className = "spy-status " + (spyState && spyState.configured ? "ok" : "warn");
  }

  function openSpyModal() {
    spyMsgEl.textContent = "";
    spyMsgEl.className = "modal-msg";
    spyOverlay.classList.add("show");
    renderSpyModal();
    fetch("/api/competitor")
      .then(function (r) { return r.json(); })
      .then(function (d) { spyState = d; renderSpyModal(); })
      .catch(function (e) { console.warn("查竞品凭据状态失败:", e); });
  }

  function saveSpyCreds() {
    const d = I18N[lang];
    const auth = document.getElementById("spy-auth").value.trim();
    if (!auth) {
      spyMsgEl.textContent = d.spyNeedAuth;
      spyMsgEl.className = "modal-msg err";
      return;
    }
    const btn = document.getElementById("spy-save");
    btn.disabled = true;
    spyMsgEl.textContent = d.spyChecking;
    spyMsgEl.className = "modal-msg";
    fetch("/api/competitor/token", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ api_key: auth }),
    })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        btn.disabled = false;
        if (!res.ok) {
          // 验不过时后端不会覆盖旧凭据,这一点要让用户看见,不然他以为白填了
          spyMsgEl.textContent = res.j.error || "保存失败";
          spyMsgEl.className = "modal-msg err";
          return;
        }
        spyMsgEl.textContent = I18N[lang].spySaved;
        spyMsgEl.className = "modal-msg ok";
        document.getElementById("spy-auth").value = "";
        spyState = { configured: true, masked: res.j.masked, updated_at: "" };
        renderSpyModal();
      })
      .catch(function (e) {
        btn.disabled = false;
        spyMsgEl.textContent = String(e);
        spyMsgEl.className = "modal-msg err";
      });
  }

  spyBtn.addEventListener("click", openSpyModal);
  document.getElementById("spy-save").addEventListener("click", saveSpyCreds);
  document.getElementById("spy-close").addEventListener("click", function () {
    spyOverlay.classList.remove("show");
  });
  spyOverlay.addEventListener("click", function (e) {
    if (e.target === spyOverlay) spyOverlay.classList.remove("show");
  });
  spyReady = true;   // 到这里这个模块的变量和函数才真正可用

  // ===== 图片放大 =====
  // 聊天里的素材缩略图只有 100~160px(表格里更小),而"看清竞品的画面长什么样"
  // 正是这个功能的意义所在。所以任何一张图都能点开看原图。
  //
  // **用事件委托挂在消息区上,不是给每张图单独绑**:图片是 AI 回复渲染出来的,
  // 每次新消息都会产生新的 img 节点,逐个绑定就得在每次渲染后再跑一遍,漏一次就失灵。
  // 委托到父节点上,以后不管怎么渲染都自动生效。
  var lightboxReady = false;
  const lbox = document.getElementById("lightbox");
  const lboxImg = document.getElementById("lightbox-img");

  function openLightbox(src, alt) {
    const d = I18N[lang];
    lboxImg.src = src;
    lboxImg.alt = alt || "";
    document.getElementById("lightbox-size").textContent = d.imgLoading;
    const link = document.getElementById("lightbox-open");
    link.href = src;
    link.textContent = d.imgOpenNew;
    lbox.classList.add("show");
  }

  function closeLightbox() {
    lbox.classList.remove("show");
    lboxImg.removeAttribute("src");   // 别让大图一直占着内存
  }

  // 原图加载完才知道真实尺寸,顺手告诉用户 —— 判断素材能不能用得看清晰度
  lboxImg.addEventListener("load", function () {
    const w = lboxImg.naturalWidth, h = lboxImg.naturalHeight;
    document.getElementById("lightbox-size").textContent = w && h ? w + " × " + h : "";
  });
  lboxImg.addEventListener("error", function () {
    document.getElementById("lightbox-size").textContent = "😕";
  });

  messagesEl.addEventListener("click", function (e) {
    const t = e.target;
    if (t && t.tagName === "IMG" && t.src) openLightbox(t.src, t.alt);
  });
  document.getElementById("lightbox-close").addEventListener("click", closeLightbox);
  lbox.addEventListener("click", function (e) {
    if (e.target === lbox) closeLightbox();   // 点空白处关掉,点图本身不关
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && lbox.classList.contains("show")) closeLightbox();
  });
  lightboxReady = true;

  syncFromServer();

  inputEl.focus();
</script>
</body>
</html>

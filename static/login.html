<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>登录 · TalkAD</title>
  <!-- 站点图标:对话气泡 + 上升柱状 = 用聊天管广告数据。
       SVG 优先(任意尺寸都清晰),PNG 兜底给不认 SVG 图标的老 Safari。 -->
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="alternate icon" href="/static/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <meta name="theme-color" content="#171717">
<style>
  :root {
    --bg: #fafafa; --panel: #ffffff; --text: #0a0a0a; --muted: #737373;
    --accent1: #171717; --accent2: #171717; --accent-fg: #fafafa; --border: #e5e5e5;
    --shadow: 0 1px 2px 0 rgba(0,0,0,.05);
    --bad: #b42318; --good: #067647;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0a0a0a; --panel: #171717; --text: #fafafa; --muted: #a1a1a1;
      --accent1: #fafafa; --accent2: #fafafa; --accent-fg: #171717; --border: #262626;
      --shadow: 0 1px 2px 0 rgba(0,0,0,.4);
      --bad: #fda29b; --good: #75e0a7;
    }
  }
  .ico { width:16px; height:16px; flex:none; }
  .logo-ico { width:20px; height:20px; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100dvh; display: grid; place-items: center; padding: 20px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
  }
  .card {
    width: 100%; max-width: 400px; background: var(--panel);
    border: 1px solid var(--border); border-radius: 20px;
    padding: 32px 30px; box-shadow: var(--shadow);
  }
  .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
  .logo {
    width: 42px; height: 42px; border-radius: 13px;
    background: var(--accent1); color: var(--accent-fg);
    display: grid; place-items: center; font-size: 22px;
    box-shadow: 0 4px 14px -3px color-mix(in srgb, var(--accent1) 50%, transparent);
  }
  h1 { font-size: 18px; font-weight: 700; }
  label { display: block; font-size: 12.5px; font-weight: 600; margin: 14px 0 6px; }
  input {
    width: 100%; padding: 11px 14px; font: inherit; font-size: 14px;
    border: 1.5px solid var(--border); border-radius: 12px;
    background: var(--bg); color: var(--text); outline: none;
  }
  input:focus { border-color: var(--accent1); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent1) 12%, transparent); }
  button {
    width: 100%; margin-top: 22px; padding: 12px; font: inherit; font-size: 14.5px; font-weight: 600;
    background: var(--accent1); color: var(--accent-fg);
    border: 0; border-radius: 12px; cursor: pointer;
  }
  button:disabled { opacity: .55; cursor: not-allowed; }
  .switch { text-align: center; margin-top: 18px; font-size: 12.5px; color: var(--muted); }
  .switch a { color: var(--accent1); cursor: pointer; text-decoration: none; font-weight: 600; }
  .msg { margin-top: 14px; font-size: 12.5px; line-height: 1.6; min-height: 18px; }
  .msg.err { color: var(--bad); }
  .msg.ok { color: var(--good); }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="logo"><svg class="ico logo-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></svg></div>
      <div>
        <h1 id="title">登录</h1>
        <div style="font-size:12px;color:var(--muted)" id="subtitle">TalkAD</div>
      </div>
    </div>

    <form id="form" autocomplete="on" style="margin-top:22px">
      <label for="username">用户名</label>
      <input id="username" name="username" type="text" autocomplete="username" required />

      <label for="password">密码</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required />

      <div id="invite-wrap" style="display:none">
        <label for="invite">邀请码</label>
        <input id="invite" name="invite" type="password" autocomplete="off" />
      </div>

      <button type="submit" id="submit">登录</button>
    </form>

    <div class="msg" id="msg"></div>
    <div class="switch" id="switch"></div>
  </div>

<script>
  var mode = "login";          // login | register
  var inviteRequired = false;

  var $ = function (id) { return document.getElementById(id); };
  function setMsg(text, kind) {
    $("msg").textContent = text || "";
    $("msg").className = "msg" + (kind ? " " + kind : "");
  }

  function render() {
    var isReg = mode === "register";
    $("title").textContent = isReg ? "注册账号" : "登录";
    $("submit").textContent = isReg ? "注册并进入" : "登录";
    $("password").setAttribute("autocomplete", isReg ? "new-password" : "current-password");
    $("invite-wrap").style.display = (isReg && inviteRequired) ? "block" : "none";
    $("switch").innerHTML = isReg
      ? '已经有账号了?<a id="to-login">去登录</a>'
      : '还没有账号?<a id="to-reg">注册一个</a>';
    var a = $("to-login") || $("to-reg");
    if (a) a.onclick = function () { mode = isReg ? "login" : "register"; setMsg(""); render(); };
  }

  // 先问后端:有没有账号?要不要邀请码?
  fetch("/api/auth-status")
    .then(function (r) { return r.json(); })
    .then(function (d) {
      inviteRequired = !!d.invite_required;
      if (d.logged_in_as) { location.href = "/platforms"; return; }   // 已登录 → 去挑平台
      if (!d.has_users) {                                     // 一个账号都没有 → 直接进注册
        mode = "register";
        setMsg("还没有任何账号,先注册第一个吧。", "ok");
      }
      render();
    })
    .catch(function () { render(); });

  $("form").addEventListener("submit", function (e) {
    e.preventDefault();
    var btn = $("submit");
    var body = {
      username: $("username").value.trim(),
      password: $("password").value,
    };
    if (mode === "register") body.invite = $("invite").value;
    if (!body.username || !body.password) { setMsg("用户名和密码都要填", "err"); return; }

    btn.disabled = true;
    setMsg(mode === "register" ? "注册中…" : "登录中…");
    fetch(mode === "register" ? "/api/register" : "/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    })
      .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (res) {
        if (!res.ok) { setMsg(res.d.error || "失败了,再试一次", "err"); btn.disabled = false; return; }
        setMsg("成功,正在进入…", "ok");
        location.href = "/platforms";
      })
      .catch(function (err) {
        setMsg("连不上服务器:" + err.message, "err");
        btn.disabled = false;
      });
  });
</script>
</body>
</html>
